  // 캔버스를 그리는 탭이 있어 innerHTML 주입과 draw를 분리한다 (배너를 앞에 붙이려면 한 곳에서 써야 함)
  let body = "", after = null;
  if(tab==="list"){         body = filterBar() + viewList(); after = armListMore; }  // 목록 감시자는 주입 후에 걸어야 한다
  else if(tab==="cat")      body = filterBar() + viewCategory();
  else if(tab==="limit")    body = viewLimit();
  else if(tab==="analysis"){
    const seg = pills([["spend","지출분석"],["tax","연말정산"]], anView, "setAnView");
    // 연말정산은 개인 단위라 '전체' 없는 멤버 바를 쓴다 (합산하면 각자의 25% 문턱이 뒤섞임)
    // chart.js는 지연 로드라 아직 없을 수 있다 — drawWhenChartReady가 도착을 기다렸다 그린다
    if(anView==="tax"){ body = seg + memberBar(tyMember,"setTyMember") + viewTaxYear(); after = ()=>drawWhenChartReady(drawTaxChart); }
    else { body = seg + memberFilterPills() + viewAnalysis(); after = ()=>drawWhenChartReady(drawAnalysisCharts); }
  }
  else if(tab==="acct")     body = viewAccount();
  else if(tab==="master")   body = viewMaster();
  m.innerHTML = warnBanner() + body;   // 부분 로드 실패는 어느 탭에 있든 상단에 고정 노출
  if(after) after();
}

// 일부 테이블이 안 실려온 상태를 명시하는 배너. 앱은 폴백값으로 계속 동작하므로 화면을 가리지 않는다
// — 조용히 넘기면 폴백(빈 한도·DEFAULT_CATS)이 '설정이 지워진 것'처럼 보이고, 그 위에 저장하면 진짜로 덮어쓴다.
function warnBanner(){
  if(!loadWarn.length) return "";
  return `<div class="sec" style="padding-bottom:0"><div class="warn-card">
    <div class="wc-t">⚠️ 일부 설정을 불러오지 못했어요</div>
    <div class="wc-b"><b>${esc(loadWarn.join(" · "))}</b><br>
      지금 화면엔 기본값이 대신 표시됩니다. 이 상태에서 저장하면 기존 설정을 덮어쓸 수 있으니 먼저 다시 불러와주세요.</div>
    <button class="wc-btn" onclick="retryLoad()">다시 불러오기</button>
  </div></div>`;
}

async function retryLoad(){
  $("main").innerHTML='<div class="spin"></div>';
  try{ await loadAll(); loadError=null; }
  catch(e){
    if(isAuthErr(e)){ showAuth(); return; }   // 위와 같은 이유
    loadError=e.message;
  }
  render();
}

/* ── 필터 바 (내역·분류·분석 공통: 주기 + 멤버) ── */
// 멤버 필터 필 바 ('전체' 포함) — 내역·분류·분석·계좌 공통
function memberFilterPills(){
  return pills(["전체",...MEMBERS], memberFilter, "setMemberFilter");
}
// 주기 탐색은 필 4개가 아니라 위아래 룰선 사이의 한 줄(.pnav)이다.
// ⚠️ 옛 구조는 '전체'(기간 스코프) 필 바로 아래에 '전체'(멤버) 필이 와서
//    같은 글자의 다른 뜻이 세로로 붙어 있었다 → 기간 쪽을 '전체 기간'으로 분리했다.
function filterBar(){
  const allOn = scope === "all";
  const _pLabel = memberFilter!=="전체" ? viewedPeriod(memberFilter).label
                : (periodOffset ? `${-periodOffset}주기 전 · 각자` : "각자 기준");
  const label = allOn ? "전체 기간" : (periodOffset ? _pLabel : `이번 주기 · ${_pLabel}`);
  const arrow = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
  return `<div class="pnav">
    <button onclick="movePeriod(-1)" aria-label="이전 주기"${allOn?" disabled":""}>${arrow("m15 18-6-6 6-6")}</button>
    <div class="pnav-t" onclick="resetPeriod()">${esc(label)}</div>
    <button onclick="movePeriod(1)" aria-label="다음 주기"${(allOn||periodOffset>=0)?" disabled":""}>${arrow("m9 18 6-6-6-6")}</button>
  </div>${memberFilterPills().replace(/<\/div>$/,
    `<span class="pill${allOn?" on":""}" onclick="setScope('all')">전체 기간</span></div>`)}`;
}
// 주기 이동 (◀ 과거 / ▶ 미래, 이번 주기까지) — 누르면 '이번 주기' 스코프로 전환
function movePeriod(d){ periodOffset=Math.min(0,periodOffset+d); scope="current"; render(); }
function resetPeriod(){ periodOffset=0; scope="current"; render(); }

/* ── 멤버 전용 바 (한도·계좌 탭: '전체' 없음) ── */
function memberBar(current, fn){
  return pills(MEMBERS, current, fn);
}

/* ── 내역 탭 ── */
function viewList(){
  const all=scoped();
  if(!all.length) return `<div class="sec">${empty("📭","내역이 없어요.\n＋ 버튼으로 추가해보세요.")}</div>`;
  const searchBar=`<div class="searchw"><div>
    <input class="search-inp" id="searchBox" placeholder="메모·카테고리·계좌 검색" value="${esc(searchQ)}" oninput="setSearch(this.value)">
    <button class="search-x" id="searchClear" onclick="setSearch('')" aria-label="검색 지우기" style="display:${searchQ?'flex':'none'}">✕</button>
  </div></div>`;
  return searchBar+`<div id="listResults">${listResultsHtml(all)}</div>`;
}
/* ── 내역 목록: 날짜 그룹 단위 점진 렌더링 ──
   ⚠️ 전량을 한 번에 innerHTML로 넣지 말 것. 행마다 DOM 노드가 16개라 '전체' 스코프에서 통째로 주입하면
   폰(CPU 4배 근사) 기준 515건 1.1초 / 2,000건 4.7초 / 10,000건 20초가 걸린다(2026-08-15 실측).
   LIST_CHUNK행씩 그리고 하단 감시자(#listMore)가 보이면 이어 붙인다 — 자르는 단위는 '행'이 아니라
   '날짜 그룹'이다. 행으로 자르면 경계에서 같은 날짜 헤더가 두 번 나온다.
   이번 주기는 보통 30~120건이라 첫 청크에 다 들어가고 감시자 자체가 안 생긴다(예전과 동작 동일). */
const LIST_CHUNK = 150;
let LIST_G = [];       // [[날짜, 행[]], …] 최신순 — 안 그린 것까지 포함한 전체
let LIST_I = 0;        // 다음에 그릴 그룹 인덱스
let _listObs = null;   // IntersectionObserver — 재렌더마다 갈아끼운다(안 끊으면 detached 노드를 잡고 샌다)

function dayGroupHtml(date, dr){
  const days=["일","월","화","수","목","금","토"];
  const d=parseDate(date), de=expOf(dr);
  let h=`<div class="dgroup"><div class="dhead"><span>${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})</span><span class="dtot">${de>0?'지출 '+won(de):''}</span></div>`;
  dr.forEach(r=>{
    const cls=r.type==="입금"?"g":"r", pf=r.type==="입금"?"+":"-";
    // 옛 칩 3개 나열 → 가운뎃점으로 이은 한 줄. 이동 leg 배지만 색으로 남긴다.
    // ⚠️ 사용자 문자열은 전부 esc() 를 통과해야 한다 (계좌명·메모에 < 나 따옴표가 들어올 수 있다).
    const sub=[];
    if(isTransfer(r)) sub.push(`<span class="chip trf">${r.type==="입금"?"입금":"출금"} · 이동</span>`);
    sub.push(esc(r.account));
    if(r.method) sub.push(esc(r.method));
    if(r.member) sub.push(`<span class="chip mem">${esc(r.member)}</span>`);
    if(r.memo)   sub.push(`<span class="memo">${esc(r.memo)}</span>`);
    h+=`<div class="item"><div class="i-ic">${icon(r.category)}</div><div class="i-bd">
      <div class="i-top"><span class="i-cat">${esc(r.category)}</span><span class="i-amt ${cls}">${pf}${won(r.amount)}</span></div>
      <div class="i-foot"><div class="i-sub">${sub.join(" · ")}</div>
        <div class="i-act"><button class="b-edit" onclick="editEntry('${r.id}')">수정</button><button class="b-del" onclick="delEntry('${r.id}')">삭제</button></div></div>
    </div></div>`;
  });
  return h+`</div>`;
}
function listRestCount(){ let n=0; for(let i=LIST_I;i<LIST_G.length;i++) n+=LIST_G[i][1].length; return n; }
function listChunkHtml(){
  let h="", n=0;
  while(LIST_I < LIST_G.length && n < LIST_CHUNK){
    const [date, dr] = LIST_G[LIST_I++];
    h += dayGroupHtml(date, dr);
    n += dr.length;
  }
  return h;
}
function listMoreHtml(){
  return LIST_I < LIST_G.length
    ? `<div id="listMore" style="text-align:center;padding:18px 0;font-size:.76rem;color:var(--ink-3);font-weight:600">남은 ${comma(listRestCount())}건 불러오는 중…</div>`
    : "";
}
function growList(){
  const s=$("listMore"); if(!s) return;
  s.insertAdjacentHTML("beforebegin", listChunkHtml());
  if(LIST_I >= LIST_G.length){                       // 다 그렸으면 감시자를 걷어낸다
    if(_listObs){ _listObs.disconnect(); _listObs=null; }
    s.remove(); return;
  }
  s.textContent = `남은 ${comma(listRestCount())}건 불러오는 중…`;
  // 청크를 넣어도 감시자가 여전히 화면 안이면 IntersectionObserver엔 '교차 변화'가 없어 다시 안 쏜다
  // → 화면이 찰 때까지는 직접 이어 그린다(안 하면 스크롤할 것도 없이 멈춰 보인다).
  if(s.getBoundingClientRect().top < innerHeight) requestAnimationFrame(growList);
}
/* 목록을 새로 주입한 뒤 반드시 호출 — render()의 after 훅과 setSearch 부분갱신 양쪽에서 */
function armListMore(){
  if(_listObs){ _listObs.disconnect(); _listObs=null; }
  const s=$("listMore"); if(!s) return;
  _listObs = new IntersectionObserver(es=>{ if(es.some(e=>e.isIntersecting)) growList(); }, {rootMargin:"600px"});
  _listObs.observe(s);   // observe()는 현재 상태로 콜백을 한 번 쏘므로 첫 화면 채우기도 여기서 걸린다
}

/* 검색 결과 목록만 반환 (검색바 제외) — setSearch가 #listResults만 부분 갱신할 때 재사용 */
function listResultsHtml(all){
  all = all || scoped();
  const q=searchQ.trim().toLowerCase();
  const rows=q?all.filter(r=>[r.memo,r.category,r.account,r.method,r.member].some(f=>f&&String(f).toLowerCase().includes(q))):all;
  if(!rows.length){ LIST_G=[]; LIST_I=0; return `<div class="sec">${empty("🔍",`'${esc(searchQ)}' 검색 결과가 없어요.`)}</div>`; }
  const inc=incOf(rows), exp=expOf(rows);
  const groups={}; rows.forEach(r=>{(groups[r.date]=groups[r.date]||[]).push(r);});
  LIST_G = Object.keys(groups).sort((a,b)=>b.localeCompare(a)).map(d=>[d,groups[d]]);
  LIST_I = 0;
  let h=`<div class="sec">`;
  if(scope==="current"&&!q) h+=`<div class="cards">
    <div class="card inc"><div class="c-lb">수입</div><div class="c-v g">+${won(inc)}</div></div>
    <div class="card exp"><div class="c-lb">지출</div><div class="c-v r">-${won(exp)}</div></div>
  </div>`;
  // 건수는 '그린 것'이 아니라 '걸린 것' 전체를 보여준다 — 점진 렌더링이 집계를 줄인 것처럼 보이면 안 된다
  h+=`<div style="font-size:.72rem;color:var(--ink-3);font-weight:600;text-align:right;padding:0 2px">${q?`'${esc(searchQ)}' 검색 결과 · 지출 ${won(exp)} · `:""}${rows.length}건</div>`;
  h+=listChunkHtml();
  return h+listMoreHtml()+`</div>`;
}

/* ── 분류 탭 ── */
// field: 'category' | 'method' — 분류 탭 집계 기준. 값이 비면 '미지정'으로 묶음 (입금 등 결제수단 없는 건)
function aggCat(rs, field="category"){ const o={}; rs.forEach(r=>{ if(isTransfer(r)) return; const k=r[field]||"미지정"; (o[k]=o[k]||{inc:0,exp:0}); r.type==="입금"?o[k].inc+=r.amount:o[k].exp+=r.amount;}); return o; }
function catCard(cat,v,pct,drill){
  const net=v.inc-v.exp;
  // ⚠️ 수입·지출이 함께 있는 항목만 둘을 따로 적는다.
  //    한쪽뿐이면 위 합계와 같은 값이라 화면에 같은 금액이 두 번 나온다(옛 동작).
  const sub = (v.inc>0 && v.exp>0)
    ? `<div class="c-sub">수입 +${won(v.inc)} · 지출 -${won(v.exp)}</div>` : "";
  const meter = pct>0
    ? `<div class="c-st"><div class="barw"><div class="bar" style="width:${pct}%"></div></div><span class="c-pct">${pct}%</span></div>` : "";
  const clk=drill?` class="ccard link" onclick="drillTo('${jsq(cat)}')"`:` class="ccard"`;
  return `<div${clk}><div class="c-h"><div class="c-l"><div class="c-ic">${icon(cat)}</div><div class="c-nm">${esc(cat)}</div></div><span class="c-bd ${net>=0?'bg':'br'}">${net>=0?'+':''}${won(net)}</span></div>${sub}${meter}</div>`;
}
// 분류 카드 → 내역 탭 드릴다운 (검색어로 해당 항목만 필터, 주기·멤버 필터 유지)
function drillTo(q){ tab="list"; searchQ=q; buildNav(); render(); }
function viewCategory(){
  const field = catBy==="method" ? "method" : "category";
  const byBar=pills([["category","카테고리별"],["method","결제수단별"]], catBy, "setCatBy");
  const rows=scoped(), sum=aggCat(rows,field);
  if(!Object.keys(sum).length) return byBar+`<div class="sec">${empty("📭","데이터가 없습니다")}</div>`;
  const totExp=Object.values(sum).reduce((s,v)=>s+v.exp,0);
  let h=byBar+`<div class="sec">`;
  Object.entries(sum).sort((a,b)=>b[1].exp-a[1].exp).forEach(([c,v])=>h+=catCard(c,v,totExp?Math.round(v.exp/totExp*100):0,c!=="미지정"));
  if(scope==="all"){
    const _catMem=memberFilter!=="전체"?memberFilter:MEMBERS[0];
    // scope==='all'이라 rows===myRows() — 각 행을 그 멤버의 주기로 버킷팅(라벨은 기준 멤버 것)
    const ps=recentPeriods(AN_PERIODS,_catMem), buckets=bucketByPeriod(rows,AN_PERIODS,_catMem);
    const mixed=mixedPeriods();
    for(let i=ps.length-1;i>=0;i--){
      const ma=aggCat(buckets[i],field);
      if(!Object.keys(ma).length) continue;
      // .sec-t 가 더는 uppercase 가 아니라 그 상쇄용 인라인 style 이 필요 없어졌다
      h+=`<div class="sec-t">${ps[i].label}${mixed?'<span>각자 주기 기준</span>':''}</div>`;
      Object.entries(ma).sort((a,b)=>b[1].exp-a[1].exp).forEach(([c,v])=>h+=catCard(c,v,0));
    }
  }
  return h+`</div>`;
}

/* ── 한도 탭 (멤버별) ── */
function viewLimit(){
  if(!limitMember) return `<div class="sec">${empty("👥","설정에서 멤버를 추가해주세요.")}</div>`;
  const cur=billingPeriod(limitMember);
  const memberLimits=LIMITS[limitMember]||{};
  const spent={};
  ROWS.filter(r=>r.member===limitMember&&r.type==="지출"&&!isTransfer(r)&&inPeriod(r.date,cur))
      .forEach(r=>spent[r.category]=(spent[r.category]||0)+r.amount);

  // 한도 지정 대상 = catsOf(멤버) — master_data 카테고리 + 저장된 한도(레거시 보존)
  // → '계좌간 이동'처럼 설정 카테고리에 없는 지출 항목은 한도 UI에 노출하지 않음
  const cats=catsOf(limitMember);
  const items=cats.map(cat=>{
    const limit=memberLimits[cat]||0, used=spent[cat]||0;
    return {cat,limit,used,pct:limit?Math.round(used/limit*100):0};
  }).sort((a,b)=>b.pct-a.pct);
  const over=items.filter(i=>i.limit&&i.pct>=100);

  let h=memberBar(limitMember,"setLimitMember")+`<div class="sec">`;
  h+=`<div class="sec-t" style="padding-top:4px">${esc(limitMember)}의 이번 주기 한도 · ${cur.label}</div>`;
  if(over.length) h+=`<div class="alert">⚠️ <b>${over.map(o=>esc(o.cat)).join(", ")}</b> 한도 초과!</div>`;

  // 종합 요약 — 한도가 설정된 카테고리 전체의 사용률
  const withLim=items.filter(i=>i.limit>0);
  if(withLim.length){
    const tl=withLim.reduce((s,i)=>s+i.limit,0), tu=withLim.reduce((s,i)=>s+i.used,0);
    const tp=tl?Math.round(tu/tl*100):0;
    const st=tp>=100?"over":tp>=WARN_TH?"warn":"ok";
    h+=`<div class="lcard ${st}">
      <div class="l-h"><div class="c-l"><div class="c-ic">📦</div><div class="c-nm">전체 한도 요약</div></div><div class="l-pct ${st}">${tp}%</div></div>
      <div class="l-bar-w"><div class="l-bar ${st}" style="width:${Math.min(tp,100)}%"></div></div>
      <div class="l-meta"><span>${won(tu)}</span><span class="l-lim">/ ${won(tl)}</span><span style="margin-left:auto;font-size:.76rem;color:${tu<=tl?'var(--inc)':'var(--exp)'}">${tu<=tl?'남음 '+won(tl-tu):'초과 '+won(tu-tl)}</span></div>
    </div>`;
  }

  if(!items.length){
    h+=empty("🎯","지출 내역이나 설정된 한도가 없어요.\n아래에서 한도를 직접 추가할 수 있어요.");
  } else {
    items.forEach(it=>{
      const state=!it.limit?"ok":it.pct>=100?"over":it.pct>=WARN_TH?"warn":"ok";
      h+=`<div class="lcard ${state}">
        <div class="l-h"><div class="c-l"><div class="c-ic">${icon(it.cat)}</div><div class="c-nm">${esc(it.cat)}</div></div><div class="l-pct ${state}">${it.limit?it.pct+'%':'한도없음'}</div></div>`;
      if(it.limit){
        h+=`<div class="l-bar-w"><div class="l-bar ${state}" style="width:${Math.min(it.pct,100)}%"></div></div>
          <div class="l-meta"><span>${won(it.used)}</span><span class="l-lim">/ ${won(it.limit)}</span></div>`;
        if(state==="over") h+=`<div class="l-msg">${won(it.used-it.limit)} 초과</div>`;
        else if(state==="warn") h+=`<div class="l-msg warn">한도까지 ${won(it.limit-it.used)}</div>`;
      } else {
        h+=`<div class="l-meta"><span>이번 주기 ${won(it.used)} 사용</span></div>`;
      }
      h+=`<div class="l-edit"><input id="lim_${esc(limitMember)}_${esc(it.cat)}" inputmode="numeric" placeholder="월 한도 (비우면 삭제)" value="${it.limit?comma(it.limit):''}" oninput="fmtNum(this)"><button onclick="saveLimit('${jsq(limitMember)}','${jsq(it.cat)}')">저장</button></div>
      </div>`;
    });
  }
  return h+`</div>`;
}

/* ── 분석 탭 ── */
let _anStash = null;   // 차트용 데이터 보관 (viewAnalysis → drawAnalysisCharts)

/* 분석 보조 ── 카테고리 '평소 금액(중앙값)' 대비 크게 튄 개별 지출(일회성 이상치) 추출 */
const _median = a => { const s=[...a].sort((x,y)=>x-y), n=s.length; return n?(n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2):0; };
const _md     = s => { const d=parseDate(s); return `${d.getMonth()+1}/${d.getDate()}`; };
function bigSpends(rows){
  const byCat={};
  rows.filter(r=>r.type==="지출"&&!isTransfer(r)).forEach(r=>(byCat[r.category]=byCat[r.category]||[]).push(r));
  const out=[];
  Object.entries(byCat).forEach(([,arr])=>{
    if(arr.length<3) return;                          // 표본이 적으면 '평소'를 신뢰 못함
    const med=_median(arr.map(r=>r.amount)); if(med<=0) return;
    arr.forEach(r=>{ if(r.amount>=med*2.5 && r.amount>=30000) out.push({...r,med,ratio:r.amount/med}); });
  });
  return out.sort((a,b)=>b.ratio-a.ratio).slice(0,8);  // 평소 대비 배수가 큰 순
}

function viewAnalysis(){
  const _anMem = memberFilter!=="전체" ? memberFilter : MEMBERS[0];
  const periods = recentPeriods(AN_PERIODS, _anMem);
  const mine = myRows();  // ROWS 스캔 1회로 고정 — 주기별·반복지출에서 재사용(주기 수만큼 재필터하던 것 제거)
  // 각 행을 '그 멤버의' 주기로 버킷팅 — 내역 탭과 같은 기준 (위 bucketByPeriod 주석 참조)
  const rowsByPeriod = bucketByPeriod(mine, AN_PERIODS, _anMem);
  const labels = periods.map(p => p.label.split(" ")[0]);

  // 주기별 수입·지출 합계
  const period = rowsByPeriod.map(rs => ({inc:incOf(rs), exp:expOf(rs)}));
  const incomeByPeriod = period.map(d=>d.inc);

  // 최근(현재) 주기 카테고리별 지출 (도넛)
  const curRows = rowsByPeriod[rowsByPeriod.length-1] || [];
  const curCat = {};
  curRows.filter(r=>r.type!=="입금"&&!isTransfer(r)).forEach(r => curCat[r.category]=(curCat[r.category]||0)+r.amount);
  const curCatArr = Object.entries(curCat).sort((a,b)=>b[1]-a[1]);   // [[cat,amt], ...]
  const totExp = curCatArr.reduce((s,[,a])=>s+a,0);

  // 카테고리 × 주기 지출 매트릭스 → 스택 막대용 (전체합 상위 6 + 나머지 '기타')
  const catByPeriod = {};
  rowsByPeriod.forEach((rs,pi)=>rs.filter(r=>r.type!=="입금"&&!isTransfer(r))
    .forEach(r=>{(catByPeriod[r.category]=catByPeriod[r.category]||Array(periods.length).fill(0))[pi]+=r.amount;}));
  const catTotals = Object.entries(catByPeriod).map(([c,a])=>[c,a.reduce((s,x)=>s+x,0)]).sort((a,b)=>b[1]-a[1]);
  // ⚠️ 상한은 6이다(검증된 슬롯 전부). '기타'는 슬롯이 아니라 무채색이라 7번째 색이 아니다. 안전한 색이 6개뿐이라 이걸 넘기면 색이 순환한다.
  //    도넛·스택막대·추이라인이 '같은' 상위 6을 쓰고 같은 슬롯 색을 받는다 —
  //    한 화면 안에서 같은 색이 같은 항목을 뜻해야 하므로.
  const TOPN=6;
  const topCats = catTotals.slice(0,TOPN).map(([c])=>c);
  setCatSlots(topCats);

  const stackSeries = topCats.map(c=>({cat:c,data:catByPeriod[c]}));
  if(catTotals.length>TOPN){
    const etc=Array(periods.length).fill(0);
    catTotals.slice(TOPN).forEach(([c])=>catByPeriod[c].forEach((v,i)=>etc[i]+=v));
    stackSeries.push({cat:ETC_CAT,data:etc});
  }

  // 도넛도 같은 상한을 받는다 — 예전엔 curCatArr 전량이 넘어가 카테고리 수만큼 슬라이스가 생겼다
  const donutTop = curCatArr.filter(([c])=>_catSlots[c]);
  const donutEtc = curCatArr.filter(([c])=>!_catSlots[c]).reduce((s,[,a])=>s+a,0);
  const donutArr = donutEtc>0 ? [...donutTop,[ETC_CAT,donutEtc]] : donutTop;

  // 카테고리별 추이 (라인) — 같은 5개
  const trend = topCats.map(c => ({cat:c, data: rowsByPeriod.map(rs => expOf(rs.filter(r=>r.category===c)))}));

  _anStash = {labels, period, incomeByPeriod, stackSeries, donut:donutArr, totExp, trend};

  // 요약 스탯
  const avg  = Math.round(period.reduce((s,d)=>s+d.exp,0)/(period.length||1));
  const last = period[period.length-1]?.exp||0, prev = period[period.length-2]?.exp||0, lastInc = period[period.length-1]?.inc||0;
  const trPct  = prev?Math.round((last-prev)/prev*100):0;
  const avgPct = avg?Math.round((last-avg)/avg*100):0;
  const net    = lastInc-last;

  // 반복 지출 (세부내역 기준, 2주기 이상 등장) — 주기 판정은 위 버킷을 그대로 재사용해
  // 차트와 같은 기준을 쓴다(따로 findIndex로 재판정하면 멤버별 주기가 다시 어긋난다)
  const byMemo={};
  rowsByPeriod.forEach((rs,pi)=>rs.filter(r=>r.type==="지출"&&r.memo&&!isTransfer(r)).forEach(r=>{
    const k=r.category+"::"+r.memo.replace(/\(.*\)/,"").trim();
    (byMemo[k]=byMemo[k]||{cat:r.category,memo:r.memo,total:0,ps:new Set()});
    byMemo[k].total+=r.amount; byMemo[k].ps.add(pi);
  }));
  const rec=Object.values(byMemo).map(x=>({...x,span:x.ps.size})).filter(x=>x.span>=2).sort((a,b)=>b.total-a.total);

  // 일회성 큰 지출 = 개별 거래가 '자기 카테고리 평소(중앙값)'보다 크게 튄 이상치
  const anom = bigSpends(rowsByPeriod.flat());

  const insights = buildInsights(_anMem, periods, rowsByPeriod, curCatArr, totExp);

  // ── HTML ──
  const trChip = p => `<span class="am-d ${p>0?'r':p<0?'g':'f'}">${p>0?'▲':p<0?'▼':'–'}${Math.abs(p)}%</span>`;
  let h=`<div class="sec">`;

  // 1) 메트릭 카드 (지출 / 수입 / 평균 대비)
  h+=`<div class="astat">
    <div class="am"><div class="am-l">이번 주기 지출</div><div class="am-v r">${won(last)}</div>${prev?`<div class="am-sub">${trChip(trPct)} <span style="color:var(--ink-3)">전 주기</span></div>`:`<div class="am-sub" style="color:var(--ink-3)">기록 시작</div>`}</div>
    <div class="am"><div class="am-l">이번 주기 수입</div><div class="am-v g">${won(lastInc)}</div><div class="am-sub" style="color:var(--ink-3)">순 ${net>=0?'+':'-'}${wonShort(Math.abs(net))}</div></div>
    <div class="am"><div class="am-l">평균 대비</div><div class="am-v ${avgPct>0?'r':avgPct<0?'g':''}">${avgPct>=0?'+':''}${avgPct}%</div><div class="am-sub" style="color:var(--ink-3)">평균 ${wonShort(avg)}</div></div>
  </div>`;

  // 2) 주기별 지출 구성 — 카테고리 스택 막대 + 수입 막대 (한눈에 주기별 카테고리 지출/수입)
  if(catTotals.length || incomeByPeriod.some(v=>v>0)){
    h+=`<div class="panel"><div class="p-t">주기별 지출 구성<span class="p-sub">카테고리 누적</span></div>
      <canvas id="chartPeriod" height="200"></canvas>${mixedPeriods()
        ? `<div style="font-size:.7rem;color:var(--ink-3);margin-top:10px;line-height:1.6">※ 멤버마다 결제주기 시작일이 달라, 가로축 라벨은 ${esc(_anMem)} 기준이고 집계는 각자의 주기로 나눴어요.</div>`
        : ``}</div>`;
  }

  // 3) 카테고리별 지출 비중 (도넛, 이번 주기)
  if(totExp>0){
    h+=`<div class="panel"><div class="p-t">카테고리별 지출 비중<span class="p-sub">이번 주기</span></div>
      <div class="donut-wrap"><canvas id="chartDonut" height="220"></canvas>
        <div class="donut-center"><div class="dc-l">총 지출</div><div class="dc-v">${wonShort(totExp)}</div></div></div>
      <!-- 범례 = 직접 라벨. 라이트에서 슬롯 3개가 흰 배경 대비 3:1 미만이라
           식별이 색에만 의존하면 안 된다(dataviz relief rule) → 이름·금액·비중을 모두 적는다 -->
      <div class="dlegend">${donutArr.map(([c,a])=>`<div class="dlg"><span class="dlg-dot" style="background:${catColor(c)}"></span><span class="dlg-nm">${esc(c)}</span><span class="dlg-v">${won(a)}</span><span class="dlg-p">${Math.round(a/totExp*100)}%</span></div>`).join("")}</div>
    </div>`;
  }

  // 4) 카테고리별 추이 (라인)
  if(trend.length && catTotals.length){
    h+=`<div class="panel"><div class="p-t">카테고리별 지출 추이<span class="p-sub">상위 ${trend.length}개</span></div><canvas id="chartTrend" height="190"></canvas></div>`;
  }

  // 5) 스마트 분석 & 절약 팁
  h+=`<div class="panel"><div class="p-t">스마트 분석 & 절약 팁</div>
    ${insights.map(x=>`<div class="ins ${x.tone||''}"><div class="ins-ic">${x.ic}</div><div class="ins-bd"><div class="ins-t">${esc(x.t)}</div><div class="ins-b">${esc(x.b)}</div></div></div>`).join("")}
  </div>`;

  // 6) 반복 지출
  h+=`<div class="panel"><div class="p-t">반복 지출<span class="p-sub">2주기 이상</span></div>${rec.length?rec.map(x=>`<div class="arow"><span class="a-mo">${icon(x.cat)} ${esc(x.memo)}</span><span class="a-tag rec">${x.span}주기</span><span class="a-v">${won(x.total)}</span></div>`).join(''):'<div class="p-body">없음</div>'}</div>`;

  // 7) 일회성 큰 지출 — 자기 카테고리 평소 금액 대비 크게 튄 항목만
  h+=`<div class="panel"><div class="p-t">일회성 큰 지출<span class="p-sub">평소 대비 튄 항목</span></div>${
    anom.length?anom.map(x=>`<div class="anom"><div class="anom-ic">${icon(x.category)}</div>
      <div class="anom-bd"><div class="anom-t"><span class="anom-tt">${esc(x.memo?x.memo:x.category)}</span><span class="anom-x">${x.ratio.toFixed(1)}배</span></div>
        <div class="anom-s">${esc(x.category)} · 평소 ${wonShort(Math.round(x.med))}원대 · ${_md(x.date)}</div></div>
      <div class="anom-v">${won(x.amount)}</div></div>`).join('')
    :'<div class="p-body">카테고리 평소 금액보다 크게 튄 일회성 지출이 없어요.</div>'}</div>`;

  return h+`</div>`;
}

/* 카테고리 기반 스마트 분석 — 과지출 진단 + 절약 팁 생성 */
function buildInsights(mem, periods, rowsByPeriod, curCatArr, totExp){
  if(!totExp) return [{ic:"🌱",tone:"good",t:"이번 주기는 아직 지출이 없어요.",b:"지출이 쌓이면 카테고리별 과지출 진단과 절약 팁을 보여드릴게요."}];
  const out=[];
  const curMap = Object.fromEntries(curCatArr);

  // 1) 최대 지출 카테고리 집중도
  const [topCat, topAmt]=curCatArr[0];
  const topPct=Math.round(topAmt/totExp*100);
  out.push({ic:icon(topCat),tone: topPct>=40?"warn":"info",
    t:`가장 큰 지출은 '${topCat}' · 전체의 ${topPct}%`,
    b: topPct>=40
      ? `이번 주기 지출이 '${topCat}'(${won(topAmt)})에 쏠려 있어요. 한 카테고리가 40%를 넘으면 예산이 흔들리기 쉬워요 — 이 항목부터 줄일 여지를 찾아보세요.`
      : `'${topCat}'에 ${won(topAmt)}를 썼어요. 특정 항목에 과하게 몰리지 않은 건강한 분포예요.`});

  // 2) 한도 초과 / 임박 (멤버 한도 기준) — '전체' 필터에선 가족 합산 지출을 한 멤버 한도와
  //    비교하게 돼 거짓 경고가 뜨므로, 특정 멤버를 선택했을 때만 표시
  const lim=(memberFilter!=="전체"&&mem&&LIMITS[mem])||{};
  const overs=[], nears=[];
  Object.entries(lim).forEach(([c,l])=>{
    if(!l) return; const used=curMap[c]||0; const pct=Math.round(used/l*100);
    if(pct>=100) overs.push({c,used,l,pct}); else if(pct>=WARN_TH) nears.push({c,pct});
  });
  if(overs.length) out.push({ic:"🚨",tone:"warn",t:`한도 초과 ${overs.length}건`,
    b: overs.map(o=>`'${o.c}' ${o.pct}% (${won(o.used-o.l)} 초과)`).join(" · ")+" — 다음 주기엔 이 카테고리를 가장 먼저 조여보세요."});
  if(nears.length) out.push({ic:"⚠️",tone:"info",t:`한도 임박 ${nears.length}건`,
    b: nears.map(o=>`'${o.c}' ${o.pct}%`).join(" · ")+" — 한도까지 여유가 얼마 없어요."});

  // 3) 평소보다 급증한 카테고리 (이전 주기 평균 대비)
  const prevRows=rowsByPeriod.slice(0,-1).flat();
  const prevCnt=Math.max(periods.length-1,1);
  const prevAvg={};
  prevRows.filter(r=>r.type!=="입금"&&!isTransfer(r)).forEach(r=>prevAvg[r.category]=(prevAvg[r.category]||0)+r.amount);
  Object.keys(prevAvg).forEach(c=>prevAvg[c]/=prevCnt);
  let surge=null;
  curCatArr.forEach(([c,a])=>{
    const base=prevAvg[c]||0;
    if(base>=10000 && a>=base*1.3){ const up=Math.round((a-base)/base*100); if(!surge||up>surge.up) surge={c,up,a,base}; }
  });
  if(surge) out.push({ic:"📈",tone:"warn",t:`'${surge.c}' 지출이 평소보다 ${surge.up}% 늘었어요`,
    b:`평소 약 ${won(Math.round(surge.base))} → 이번 ${won(surge.a)}. 일시적인 지출인지, 새 습관이 생긴 건지 점검해보세요.`});

  // 4) 절약 팁 — 조절 가능한 변동 지출 중 가장 큰 항목
  const flexTop=curCatArr.find(([c])=>!FIXED_CATS.has(c));
  if(flexTop){
    const [c,a]=flexTop; const cut=Math.round(a*0.1/1000)*1000;
    out.push({ic:"💡",tone:"tip",t:`절약은 '${c}'부터 시작하세요`,
      b:`'${c}'는 줄이기 쉬운 변동 지출 중 가장 커요(${won(a)}). 여기서 10%만 아껴도 한 주기에 약 ${won(cut)}, 1년이면 ${won(cut*12)}을 모을 수 있어요.`});
  }

  // 5) 고정 vs 변동 비율
  let fixed=0;
  curCatArr.forEach(([c,a])=>{ if(FIXED_CATS.has(c)) fixed+=a; });
  const flex=totExp-fixed;
  if(fixed>0){
    const fpct=Math.round(fixed/totExp*100);
    out.push({ic:"⚖️",tone:"info",t:`고정 ${fpct}% · 변동 ${100-fpct}%`,
      b: fpct>=60
        ? `고정성 지출 비중이 높아요(${won(fixed)}). 통신·보험·구독은 한 번 줄이면 매 주기 자동으로 절약돼요 — 우선 점검 대상이에요.`
        : `변동 지출이 ${won(flex)}로 더 많아요. 변동 지출은 습관만 바꿔도 가장 빠르게 줄일 수 있는 영역이에요.`});
  }

  return out;
}

/* ── 차트 (도넛·막대·라인) ── */
let _charts=[];
function destroyCharts(){ _charts.forEach(c=>{try{c.destroy();}catch(e){}}); _charts=[]; }

/* chart.js 지연 로드 — 분석 탭에서만 쓰는 72KB다.
   <head>에 defer로 두면 DOMContentLoaded가 그걸 기다리므로 첫 DB 요청이 그만큼 늦는다
   (2026-08-24 실측: DCL이 chart.js 실행 시점과 정확히 같았다). 여기서 받으면 크리티컬 패스 밖이다. */
let _chartP = null;
function ensureChart(){
  if(window.Chart) return Promise.resolve(true);
  if(!_chartP) _chartP = new Promise(res=>{
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/chart.js";
    s.onload =()=>res(true);
    s.onerror=()=>{ _chartP=null; res(false); };   // 실패해도 앱은 살아야 한다(차트만 생략) + 다음에 재시도
    document.head.appendChild(s);
  });
  return _chartP;
}
/* 라이브러리를 기다렸다 그린다. 기다리는 사이 화면이 바뀌었으면 그리지 않는다 —
   안 그러면 없어진 캔버스에 그리거나, 새로 그려진 차트를 destroyCharts()가 지운다. */
function drawWhenChartReady(fn){
  if(window.Chart){ fn(); return; }
  const seq=_renderSeq;
  ensureChart().then(ok=>{ if(ok && seq===_renderSeq) fn(); });
}
/* OS 테마가 켜지고 꺼질 때 — CSS 토큰은 알아서 바뀌지만 캔버스는 이미 칠해진 픽셀이다.
   분석 탭에 있을 때만 다시 그린다(render 가 destroyCharts 부터 하므로 인스턴스도 정리된다). */
try {
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
    if(tab === "analysis") render();
  });
} catch(e) { /* addEventListener 미지원 구형 사파리 — 테마 전환 시 차트만 옛 색으로 남는다 */ }
function drawAnalysisCharts(){
  if(!_anStash || typeof Chart==="undefined") return;  // Chart.js CDN 실패 시 차트만 생략
  destroyCharts();
  // 색은 CSS 토큰에서 읽는다 — 하드코딩하면 OS 다크모드에서 축·격자가 옛 색으로 남는다
  const tickC=cssVar("--ink-2"), gridC=cssVar("--line"), subC=cssVar("--ink-3"), surface=cssVar("--bg");
  const axes={x:{ticks:{color:tickC,font:{size:11}},grid:{display:false}},y:{ticks:{color:subC,font:{size:10},maxTicksLimit:5,callback:v=>wonShort(v)},grid:{color:gridC}}};

  // 카테고리 스택 막대 — 지출만, 축 하나.
  // ⚠️ 수입을 오른쪽 보조축으로 되돌리지 말 것. 두 축은 배율을 임의로 정하는 순간
  //    없는 상관관계를 만들어낸다(차트 실수 1순위). 수입은 아래 요약 스탯과 내역·계좌 탭에 있다.
  const pc=$("chartPeriod");
  if(pc && _anStash.stackSeries){
    const ds=_anStash.stackSeries.map(s=>({type:"bar",label:s.cat,data:s.data,backgroundColor:catColor(s.cat),stack:"exp",borderRadius:3,borderSkipped:false,maxBarThickness:38,
      borderColor:surface,borderWidth:{top:2,right:0,bottom:0,left:0}}));  // 세그먼트 사이 2px 서피스 갭
    _charts.push(new Chart(pc,{type:"bar",data:{labels:_anStash.labels,datasets:ds},
      options:{responsive:true,interaction:{mode:"index",intersect:false},
        plugins:{legend:{labels:{color:tickC,font:{size:10},boxWidth:8,padding:6}},
          tooltip:{callbacks:{label:ctx=>` ${ctx.dataset.label}: ${won(ctx.parsed.y)}`}}},
        scales:{
          x:{ticks:{color:tickC,font:{size:11}},grid:{display:false},stacked:true},
          y:{stacked:true,beginAtZero:true,ticks:{color:subC,font:{size:10},callback:v=>wonShort(v)},grid:{color:gridC}}
        }}}));
  }

  // 도넛: 카테고리별 지출 비중
  const dc=$("chartDonut");
  if(dc && _anStash.donut.length){
    const labels=_anStash.donut.map(([c])=>c), data=_anStash.donut.map(([,a])=>a);
    _charts.push(new Chart(dc,{type:"doughnut",data:{labels,datasets:[{data,backgroundColor:labels.map(catColor),borderColor:surface,borderWidth:2,hoverOffset:6}]},
      options:{responsive:true,cutout:"64%",plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>` ${ctx.label}: ${won(ctx.parsed)} (${Math.round(ctx.parsed/_anStash.totExp*100)}%)`}}}}}));
  }

  // 라인: 카테고리별 추이
  const tc=$("chartTrend");
  if(tc && _anStash.trend.length){
    _charts.push(new Chart(tc,{type:"line",data:{labels:_anStash.labels,datasets:_anStash.trend.map(t=>({
      label:t.cat,data:t.data,borderColor:catColor(t.cat),backgroundColor:catColor(t.cat),tension:.35,borderWidth:2,pointRadius:3,pointHoverRadius:5,fill:false}))},
      options:{responsive:true,interaction:{mode:"index",intersect:false},plugins:{legend:{labels:{color:tickC,font:{size:10},boxWidth:8,padding:8}},tooltip:{callbacks:{label:ctx=>` ${ctx.dataset.label}: ${won(ctx.parsed.y)}`}}},scales:axes}}));
  }
}

/* ── 연말정산: 신용/체크/현금 사용 전략 ──
   세금 계산기가 아니라 "앞으로 뭘 쓸까" 판단용. 과세표준·세율·환급금은 계산하지 않고 소득공제액까지만 낸다.
   결제주기가 아닌 역년(1/1~12/31) 기준 — 연말정산 자체가 역년 단위라서. */
const TY_LIMIT = t => t<=70000000 ? 3000000 : 2500000;   // 공제한도: 총급여 7천만 이하 300만 / 초과 250만

/* 소득공제액. 최저사용금액(총급여 25%)은 공제율이 낮은 신용카드부터 소진된다 —
   그래서 신용 사용액이 문턱보다 적으면 초과분 전체가 30%를 받는다. */
function tyDeduct(credit, thirty, salary){
  const th=salary*.25, s=credit+thirty;
  if(salary<=0 || s<=th) return 0;
  const d = credit>=th ? (credit-th)*TY_RATE.credit + thirty*TY_RATE.check
                       : (s-th)*TY_RATE.check;
  return Math.min(d, TY_LIMIT(salary));
}

/* 공제 한도를 다 채우려면 앞으로 얼마를 더 써야 하는지 (수단별).
   tyDeduct가 구간별 선형이라 닫힌 식도 가능하지만, 문턱·한도 경계에서 케이스가 갈려 틀리기 쉽다
   → 단조 증가 함수에 대한 이분탐색으로 어떤 케이스든 한 코드로 맞춘다. */
function tyNeed(kind, credit, thirty, salary){
  if(salary<=0) return 0;
  const lim=TY_LIMIT(salary);
  if(tyDeduct(credit,thirty,salary) >= lim-1) return 0;
  const f = x => kind==="credit" ? tyDeduct(credit+x,thirty,salary) : tyDeduct(credit,thirty+x,salary);
  // 상한: 문턱을 다 밀어낸 뒤 최저 공제율(15%)로만 한도를 채우는 최악의 경우
  let lo=0, hi=salary*.25 + lim/TY_RATE.credit + 1e6;
  if(f(hi) < lim) return Infinity;
  for(let i=0;i<60;i++){ const mid=(lo+hi)/2; if(f(mid)>=lim) hi=mid; else lo=mid; }
  return Math.round(hi);
}

/* 지금 시점에서 '다음 1원'의 한계 공제율. 이 탭의 결론(뭘 쓸까)이 실제로 걸려 있는 값.
   why: limit=한도소진 / below=문턱미달 / same=신용이 문턱 아래(둘 다 30%) / split=신용 초과(15% vs 30%) */
function tyMarginal(credit, thirty, salary){
  if(salary<=0) return {credit:0, thirty:0, why:"nosal"};
  const th=salary*.25;
  if(tyDeduct(credit,thirty,salary) >= TY_LIMIT(salary)-1) return {credit:0, thirty:0, why:"limit"};
  if(credit+thirty < th)  return {credit:0, thirty:0, why:"below"};          // 문턱 소진 구간 — 어느 쪽도 공제 0
  if(credit >= th)        return {credit:TY_RATE.credit, thirty:TY_RATE.check, why:"split"};
  return {credit:TY_RATE.check, thirty:TY_RATE.check, why:"same"};           // 추가분이 문턱을 밀어내 둘 다 30%
}

/* 매핑 대상 목록. 설정(master_data)에 등록된 항목이 기준이고,
   거래엔 있는데 설정엔 없는 값은 '미등록'으로 따로 모아 매핑을 유도한다 —
   미등록을 빼면 '제일은행카드'(1,140만) 같은 실사용 값이 통째로 집계에서 빠진다. */
function tyItems(member, kind){
  const isCat = kind==="category";
  const reg = new Set((MASTER[member]||{})[isCat?"categories":"methods"]||[]);
  const used = new Set();
  ROWS.forEach(r=>{
    if(r.member!==member || isTransfer(r)) return;
    if(isCat){ if(r.type==="입금") used.add(r.category||""); }
    else     { if(r.type==="지출") used.add(r.method||""); }
  });
  const bag = (isCat?CTMAP:MTMAP)[member]||{};
  // 미등록 = 실제 쓰였거나 이미 매핑된 값 중 설정에 없는 것
  const extra = [...new Set([...used, ...Object.keys(bag)])].filter(v=>!reg.has(v));
  const srt = a => [...a].sort((x,y)=>String(x).localeCompare(String(y),"ko"));
  return {registered: srt(reg), unregistered: srt(extra)};
}
/* 올해 금액 집계 {값: 금액} — 소득=입금 카테고리별 / 지출=결제수단별.
   연말정산 화면과 설정 탭이 같은 숫자를 보여야 하므로 공용 (역년 기준, 이동 제외). */
function tyAmounts(member, kind){
  const isCat=kind==="category", year=new Date().getFullYear(), amt={};
  ROWS.forEach(r=>{
    if(r.member!==member || isTransfer(r) || String(r.date).slice(0,4)!==String(year)) return;
    if(isCat){ if(r.type==="입금") amt[r.category||""]=(amt[r.category||""]||0)+r.amount; }
    else     { if(r.type==="지출") amt[r.method||""]  =(amt[r.method||""]  ||0)+r.amount; }
  });
  return amt;
}

/* 연말정산 매핑 컨트롤 — 연말정산 화면(등록/미등록)과 설정 탭(등록/미등록) 네 곳이 같은 마크업을 쓴다.
   갈라두면 옵션 하나를 고칠 때 한 곳을 빠뜨리고, 그 화면만 조용히 옛 동작으로 남는다.
   value 빈 문자열('')은 '(미지정)' 결제수단을 가리키는 정상 키다 — tax_map의 value가 not null default '' */
function taxSelect(member, kind, value, cur){
  const opts = kind==="category" ? TY_CAT_KINDS : TY_KINDS;
  return `<select class="tym-sel${cur?'':' un'}" onchange="setTaxMap('${jsq(member)}','${kind}','${jsq(value)}',this.value)">
      <option value=""${cur?'':' selected'}>미분류</option>
      ${Object.keys(opts).map(k=>`<option value="${k}"${cur===k?' selected':''}>${opts[k]}</option>`).join("")}
    </select>`;
}
/* 매핑 행의 금액 캡션 — '집계 제외 중'은 금액이 있는데 미분류일 때만 (셋 다 같은 문구여야 함) */
const tyAmtLabel = (a, isCat, cur) =>
  `올해 ${a?won(a):(isCat?'입금 없음':'사용 없음')}${!cur&&a?' · 집계 제외 중':''}`;

/* 이름 규칙 추천 — 순서 중요 ('우리 체크카드'는 체크가 '카드'보다 먼저 걸려야 함) */
function suggestKind(method){
  const s=String(method||"").replace(/\s/g,"");
  if(!s) return "none";
  if(/체크|직불|선불/.test(s))            return "check";
  if(/현금영수증/.test(s))                 return "cash";
  if(/신용|카드/.test(s))                  return "credit";
  if(/현금/.test(s))                       return "cash";
  return "none";
}
const suggestCatKind = cat => SALARY_RE.test(String(cat||"")) ? "income" : "none";

function taxCalc(member){
  const now=new Date(), year=now.getFullYear(), m=now.getMonth()+1;
  const map=MTMAP[member]||{}, cmap=CTMAP[member]||{};
  const ytd={credit:0,check:0,cash:0,none:0,unmapped:0};
  const byMonth={credit:Array(12).fill(0), check:Array(12).fill(0), cash:Array(12).fill(0)};
  const unmapped={};            // {결제수단: 금액} — 지출 미매핑 경고 목록
  const incUnmapped={};         // {카테고리: 금액} — 소득 미매핑 경고 목록
  let salaryRaw=0, salaryCnt=0, incUnmappedTot=0;

  ROWS.forEach(r=>{
    if(r.member!==member || String(r.date).slice(0,4)!==String(year)) return;
    if(isTransfer(r)) return;
    if(r.type==="입금"){
      // 소득 판정은 오직 사용자 매핑(CTMAP)만 따른다 — 이름 규칙은 추천 UI에서만 쓴다
      const cat=r.category||"", ck=cmap[cat];
      if(ck==="income"){ salaryRaw+=r.amount; salaryCnt++; }
      else if(!ck){ incUnmapped[cat]=(incUnmapped[cat]||0)+r.amount; incUnmappedTot+=r.amount; }
      return;
    }
    if(r.type!=="지출") return;
    const meth=r.method||"", k=map[meth];
    if(!k){ ytd.unmapped+=r.amount; unmapped[meth]=(unmapped[meth]||0)+r.amount; return; }
    ytd[k]=(ytd[k]||0)+r.amount;
    if(byMonth[k]){ const mi=Number(String(r.date).slice(5,7))-1; if(mi>=0&&mi<12) byMonth[k][mi]+=r.amount; }
  });

  // 12월 전이면 현재 월로 나눠 ×12 — '이 추세로 가면 연말에 얼마'
  const proj = x => m>=12 ? x : x/m*12;
  const autoSalary = Math.round(proj(salaryRaw));
  const manual = TY_SALARY[member]||0;
  const salary = manual || autoSalary;

  const C=ytd.credit, D=ytd.check+ytd.cash, S=C+D;
  const projK={credit:proj(ytd.credit), check:proj(ytd.check), cash:proj(ytd.cash), none:proj(ytd.none)};
  const Cp=projK.credit, Dp=projK.check+projK.cash, Sp=Cp+Dp;

  // 남은 기간 시나리오 — 현재 페이스로 계속 쓴다고 보고, 그 돈을 어디로 돌릴지만 바꿔본다
  const remain=Math.max(0,12-m), pace=m?S/m:0, future=pace*remain;
  return {
    year, m, ytd, byMonth, unmapped, incUnmapped, incUnmappedTot, salary, manual, autoSalary, salaryCnt,
    th:salary*.25, limit:TY_LIMIT(salary), C, D, S, projK, Cp, Dp, Sp,
    ded:tyDeduct(Cp,Dp,salary),            // 현 추세 유지 시 연말 공제액
    dedNow:tyDeduct(C,D,salary),           // 지금까지 확정분
    remain, pace, future,
    scCredit:tyDeduct(C+future, D, salary),      // 남은 기간 전부 신용
    scCheck :tyDeduct(C, D+future, salary),      // 남은 기간 전부 체크·현금
    // '제외'로 둔 금액을 공제 대상(30%)으로 봤다면 얼마였을지 — 제외가 결정적인지 보여주는 대조군
    dedIfNone:tyDeduct(Cp, Dp+proj(ytd.none), salary),
    /* ── 앞으로 얼마나 더 쓸 수 있나 (기준: 연환산 총급여로 정해진 문턱·한도 vs 지금까지의 실제 사용액).
       예측이 아니라 '오늘 시점의 잔여'라서 연환산이 아닌 실적(C·D·S)을 쓴다. */
    room  :Math.max(0, TY_LIMIT(salary)-tyDeduct(C,D,salary)),  // 남은 공제 여력(원)
    toTh  :Math.max(0, salary*.25 - S),                         // 문턱까지 더 써야 할 금액
    need30:tyNeed("thirty", C, D, salary),                      // 체크·현금으로 한도를 채우려면
    need15:tyNeed("credit", C, D, salary),                      // 신용카드로만 채우려면
    mrg   :tyMarginal(C, D, salary)                             // 다음 1원의 한계 공제율
  };
}

/* 상태별 핵심 조언 — 이 탭의 결론에 해당하는 한 문장 */
function tyAdvice(t){
  // 매핑이 안 된 지출이 매핑된 것보다 많으면 어떤 결론도 신뢰할 수 없다 —
  // '공제 0원'이라고 단정하면 덜 쓴 탓으로 오해하게 되므로 매핑부터 안내한다
  if(!TAX_READY) return {ic:"🛠️",tone:"warn",t:"연말정산 설정 테이블이 아직 없어요",
    b:"Supabase에 tax_map 테이블을 만들어야 매핑을 저장할 수 있어요. 아래 '설치 안내'의 SQL을 실행해주세요. 그전까지는 모든 집계가 0원으로 나옵니다."};
  if(t.ytd.unmapped>0 && t.ytd.unmapped>=t.S) return {ic:"🗂️",tone:"warn",t:"먼저 결제수단을 매핑해주세요",
    b:`올해 지출 ${won(t.ytd.unmapped)}이 아직 공제 구분 없이 남아 있어 계산에 반영되지 않았어요. 아래 '결제수단 매핑'에서 지정하면 (또는 추천값 일괄 적용) 바로 결과가 나옵니다.`};
  if(t.salary<=0) return {ic:"⚙️",tone:"warn",t:"소득 카테고리를 지정해주세요",
    b:`어떤 입금을 급여로 볼지 정해야 총급여가 잡혀요. 아래 '소득 카테고리 매핑'에서 '월급' 같은 항목을 소득으로 지정하거나, 총급여를 직접 입력해주세요.${t.incUnmappedTot>0?` 올해 미지정 입금이 ${won(t.incUnmappedTot)} 있어요.`:``}`};
  const R=Math.round;
  // 이하 순서 중요: 한도 소진(확정) → 한도 도달 추세 → 문턱 미달 → 신용이 문턱 아래 → 신용이 문턱 초과.
  // '한도'와 '문턱'은 다른 개념이라, 둘을 뭉뚱그리면 정반대 조언이 나온다
  // (한도 소진 = 더 써도 공제 0 → 신용 혜택 / 문턱 초과 = 체크·현금 2배).
  if(t.dedNow>=t.limit-1) return {ic:"🏁",tone:"good",t:"공제 한도를 이미 다 채웠어요",
    b:`지금까지 쓴 것만으로 한도 ${won(t.limit)}에 도달했어요. 앞으로는 신용이든 체크든 현금이든 무엇을 더 써도 공제액은 1원도 늘지 않습니다. 그러니 남은 기간은 공제를 신경 쓰지 말고 할인·적립 혜택이 가장 좋은 신용카드를 쓰는 게 이득이에요.`};
  if(t.ded>=t.limit-1) return {ic:"🏁",tone:"good",t:`체크·현금으로 ${won(t.need30)}만 더 쓰면 한도 완성`,
    b:`지금 페이스면 연말에 한도 ${won(t.limit)}를 채웁니다. 남은 공제 여력 ${won(R(t.room))}는 체크·현금 ${won(t.need30)}(신용카드로만 채우면 ${won(t.need15)})로 메워지고, 그 뒤부터는 뭘 써도 공제가 늘지 않으니 혜택 좋은 신용카드로 갈아타세요.`};
  if(t.Sp<=t.th) return {ic:"💳",tone:"info",t:`아직 공제 0원 — 문턱까지 ${won(R(t.toTh))} 남았어요`,
    b:`총급여의 25%(${won(R(t.th))})를 넘게 써야 공제가 시작돼요. 지금까지 ${won(t.S)}를 썼으니 ${won(R(t.toTh))}가 더 필요한데, 현 추세면 연말에도 ${won(R(t.Sp))}에 그쳐 문턱을 못 넘습니다. 어차피 공제가 안 되니 할인·적립 혜택이 좋은 신용카드를 쓰는 게 유리해요.`};
  if(t.C<t.th) return {ic:"💳",tone:"tip",t:`신용카드로 ${won(R(t.th-t.C))} 더 채운 뒤 체크·현금으로`,
    b:`문턱(${won(R(t.th))})은 공제율이 낮은 신용카드부터 소진돼요. 지금은 신용 사용액이 문턱 아래라 어디에 써도 한계 공제율이 30%로 같습니다 — 그러니 문턱까지는 혜택 좋은 신용카드로 채우고, 넘어선 뒤부터 체크·현금(30%)으로 갈아타는 게 최적이에요. 남은 공제 여력 ${won(R(t.room))}는 체크·현금 ${won(t.need30)}로 채워집니다.`};
  return {ic:"✅",tone:"good",t:"지금부터는 체크·현금이 2배 유리해요",
    b:`신용 사용액 ${won(t.C)}이 이미 문턱(${won(R(t.th))})을 넘겼어요. 여기서부터 신용은 15%, 체크·현금영수증은 30% 공제라 같은 금액을 써도 공제가 두 배입니다. 남은 공제 여력 ${won(R(t.room))}를 채우려면 체크·현금 ${won(t.need30)}면 되지만, 신용카드로만 쓰면 ${won(t.need15)}가 필요해요.`};
}

/* 조언 아래 덧붙는 보조 진단 — 결론을 뒤집을 만한 요인을 놓치지 않게 */
function tyNotes(t){
  const out=[], R=Math.round;
  // '제외' 금액이 크면 공제액이 낮은 진짜 원인이 소비 습관이 아니라 매핑일 수 있다
  if(t.ytd.none>0 && t.ded<t.limit-1 && t.dedIfNone>t.ded){
    out.push({ic:"🚫",tone:"info",t:`'제외'로 둔 ${won(t.ytd.none)}이 결과를 좌우하고 있어요`,
      b:`이 금액을 공제 대상으로 보면 연말 공제액이 ${won(R(t.ded))} → ${won(R(t.dedIfNone))}으로 바뀝니다. 이체·계좌출금은 원래 대상이 아니지만, 그중 현금영수증을 발행했거나 실제 카드 결제인 항목이 섞여 있다면 매핑을 고쳐주세요.`});
  }
  return out;
}

let _tyStash=null;   // 차트용 데이터 보관 (viewTaxYear → drawTaxChart)

function viewTaxYear(){
  if(!tyMember) return `<div class="sec">${empty("👥","설정에서 멤버를 추가해주세요.")}</div>`;
  const t=taxCalc(tyMember);
  const adv=tyAdvice(t);
  const unmapArr=Object.entries(t.unmapped).sort((a,b)=>b[1]-a[1]);
  const R=Math.round;

  let h=`<div class="sec">`;
  h+=`<div class="ty-cap">${t.year}년 1월~12월(역년) 기준 · 현재 ${t.m}월까지의 실적을 <b style="color:var(--ink-2)">연환산</b>해 연말을 예측합니다. 결제주기와 무관해요.</div>`;

  // 0) 테이블 미설치 안내 — 이게 없으면 매핑이 저장되지 않아 모든 집계가 0원이 된다
  if(!TAX_READY){
    h+=`<div class="m-section" style="border-color:rgba(240,84,112,.3)">
      <div class="m-title">설치 안내 <span style="font-size:.66rem;color:var(--exp);font-weight:700">필수</span></div>
      <div style="font-size:.8rem;color:var(--ink-2);line-height:1.75;margin-bottom:12px">
        <b style="color:var(--exp)">tax_map 테이블이 없어 매핑을 저장할 수 없습니다.</b> 그래서 지금은 모든 집계가 0원으로 나와요.<br>
        Supabase 대시보드 → SQL Editor에서 아래를 한 번 실행해주세요.
      </div>
      <pre style="background:var(--fill);border:1px solid var(--line);border-radius:11px;padding:12px;overflow-x:auto;font-size:.68rem;line-height:1.6;color:var(--ink-2)">${esc(TAX_MAP_DDL)}</pre>
      <button class="m-save" style="width:100%;margin-top:10px;padding:11px" onclick="copyTaxDDL()">📋 SQL 복사</button>
    </div></div>`;
    return h;   // 설정 전에는 0원짜리 계산 화면을 보여주지 않는다 (오해의 소지)
  }

  // 1) 총급여 — 자동 추정이 기본, 어긋나면 수동 입력이 우선
  h+=`<div class="m-section">
    <div class="m-title">총급여 (연봉)</div>
    <div class="ty-sal">
      <span class="ty-sal-v">${t.salary>0?won(t.salary):"미설정"}</span>
      <span class="ty-bdg ${t.manual?'man':'auto'}">${t.manual?'수동 입력':'자동 추정'}</span>
    </div>
    <div style="font-size:.74rem;color:var(--ink-3);line-height:1.7;margin-bottom:12px">
      ${t.salaryCnt
        ? `소득으로 지정한 카테고리의 올해 입금 <b style="color:var(--ink-2)">${t.salaryCnt}건 ${won(R(t.autoSalary/12*t.m))}</b>을 ${t.m}개월로 나눠 ×12 → 추정 ${won(t.autoSalary)}`
        : `소득으로 지정된 카테고리가 없어 자동 추정이 불가능해요. 아래 '소득 카테고리 매핑'에서 지정해주세요.`}
      ${t.manual?`<br>수동값 <b style="color:var(--ink)">${won(t.manual)}</b>이 적용 중입니다.`:``}
    </div>
    ${!t.manual&&t.salaryCnt>0&&t.salaryCnt<t.m
      ? `<div class="alert" style="margin-bottom:12px">⚠️ 월급 입금이 ${t.salaryCnt}건뿐이라 ${t.m}개월치를 다 반영하지 못했어요. 추정이 실제보다 낮을 수 있으니 연봉을 직접 입력해주세요.</div>`
      : ``}
    <div class="m-add">
      <input id="ty_sal" inputmode="numeric" placeholder="총급여 직접 입력 (비우면 추정값)"
        value="${t.manual?comma(t.manual):''}" oninput="fmtNum(this)">
      <button onclick="saveTySalary('${jsq(tyMember)}')">저장</button>
    </div>
    ${t.manual?`<button class="m-save" style="width:100%;margin-top:9px;padding:9px" onclick="resetTySalary('${jsq(tyMember)}')">↩︎ 자동 추정값으로 되돌리기</button>`:``}`;
  if(t.salary>0){
    h+=`<div class="ty-facts">
      <div class="ty-fact"><div class="ty-fact-l">25% 문턱</div><div class="ty-fact-v" style="color:var(--warn)">${won(R(t.th))}</div></div>
      <div class="ty-fact"><div class="ty-fact-l">공제 한도</div><div class="ty-fact-v">${won(t.limit)}</div></div>
    </div>`;
  }
  h+=`</div>`;

  // 2) 사용액 진행 — 3색 스택 + 문턱 마커
  // 문턱 마커 라벨이 오른쪽 끝에서 잘리지 않도록 눈금 최대치에 여유를 둔다 (사용액 0일 때 마커가 100%로 붙음)
  const scaleMax=Math.max(t.Sp*1.06, t.th*1.3, 1);
  const wpc=x=>Math.max(0,x/scaleMax*100);
  // 수단별 실제 사용액은 세로 리스트로 — 큰 숫자는 '지금까지', 아래 작은 글씨가 연환산 예측
  const lg=(k,lb)=>`<div class="tyu-i">
      <span class="tyu-d" style="background:${tyColor(k)}"></span>
      <span class="tyu-n">${lb}</span>
      <span class="tyu-r">공제 ${R(TY_RATE[k]*100)}%</span>
      <span class="tyu-x"><span class="tyu-v">${won(t.ytd[k])}</span>
        <div class="tyu-s">연환산 ${won(R(t.projK[k]))}</div></span></div>`;
  h+=`<div class="panel">
    <div class="p-t">올해 사용액<span class="p-sub">${t.m}월까지 → 연환산</span></div>
    <div class="tybar-o">
      <div class="tybar-w">
        <div class="tybar-s" style="width:${wpc(t.projK.credit)}%;background:${tyColor("credit")}"></div>
        <div class="tybar-s" style="width:${wpc(t.projK.check)}%;background:${tyColor("check")}"></div>
        <div class="tybar-s" style="width:${wpc(t.projK.cash)}%;background:${tyColor("cash")}"></div>
      </div>
      ${t.th>0&&t.th<scaleMax?`<div class="tymk" style="left:${t.th/scaleMax*100}%" data-l="25% 문턱"></div>`:``}
    </div>
    <div class="tyu">
      ${lg("credit","신용카드")}${lg("check","체크카드")}${lg("cash","현금영수증")}
      <div class="tyu-i tot"><span class="tyu-n">공제 대상 합계</span>
        <span class="tyu-x"><span class="tyu-v">${won(t.S)}</span>
          <div class="tyu-s">연환산 ${won(R(t.Sp))}</div></span></div>
    </div>
    <div style="font-size:.7rem;color:var(--ink-3);margin-top:9px;line-height:1.65">
      큰 숫자는 ${t.m}월까지 실제 사용액, 아래는 이 추세의 연말 예상치 · 막대는 연환산 기준${t.ytd.none>0?` · 공제 제외 ${won(t.ytd.none)}`:``}
    </div>`;
  if(unmapArr.length){
    h+=`<div class="alert" style="margin-top:12px">⚠️ 미분류 결제수단 <b>${won(t.ytd.unmapped)}</b> (${unmapArr.length}종) — 아래에서 매핑해야 집계에 반영됩니다.</div>`;
  }
  h+=`</div>`;

  /* 3) 남은 공제 여력 — 이 탭의 실질적 답. 문턱·한도는 연환산 총급여로 정해지지만,
        '앞으로 얼마'는 오늘까지의 실제 사용액에서 재므로 연환산을 섞지 않는다.
        매핑이 대부분 안 된 상태에선 숫자가 무의미해 아예 숨긴다 (조언 패널이 매핑을 먼저 안내). */
  const mapBroken = t.ytd.unmapped>0 && t.ytd.unmapped>=t.S;
  if(t.salary>0 && !mapBroken){
    const mr=t.mrg, pc=v=>R(v*100)+"%";
    const nCard=(nm,rate,need,col,on)=>`<div class="tyn-i${on?' on':''}">
      ${on?`<div class="tyn-tag">유리</div>`:``}
      <div class="tyn-l"><span class="tyu-d" style="background:${col}"></span>${nm}</div>
      <div class="tyn-v" style="color:${rate>0?col:'var(--ink-3)'}">${pc(rate)}</div>
      <div class="tyn-s">${t.room<=0 ? '더 써도 공제 증가 없음'
        : `한도까지 <b>${won(need)}</b> 더 쓰면 완성`}</div></div>`;
    const whyTxt={
      limit:`공제 한도 ${won(t.limit)}를 이미 채웠어요. 지금부터는 신용·체크·현금 무엇을 더 써도 공제액이 늘지 않으니, 할인·적립 혜택이 가장 좋은 신용카드를 쓰는 게 이득이에요.`,
      below:`아직 25% 문턱(${won(R(t.th))}) 아래예요. 문턱은 공제율이 낮은 신용카드부터 소진되고 그 구간의 공제는 0원이라, 여기까진 혜택 좋은 신용카드로 채우는 게 유리해요.`,
      same :`신용 사용액 ${won(t.C)}이 아직 문턱(${won(R(t.th))}) 아래라, 지금 더 쓰는 돈은 어디에 쓰든 한계 공제율이 30%로 같아요. 신용으로 ${won(R(t.th-t.C))}를 더 채워 문턱을 넘긴 뒤부터 체크·현금으로 갈아타는 게 최적이에요.`,
      split:`신용 사용액이 문턱을 넘겨서, 같은 100만원을 써도 신용은 15만원·체크·현금은 30만원 공제로 정확히 2배 차이가 나요. 지금부터는 체크카드나 현금영수증을 쓰세요.`
    }[mr.why]||"";
    h+=`<div class="panel"><div class="p-t">남은 공제 여력<span class="p-sub">연환산 총급여 기준</span></div>
      <div class="tyrm-l"><span>지금까지 확정 <b>${won(R(t.dedNow))}</b></span><span>한도 <b>${won(t.limit)}</b></span></div>
      <div class="tyrm-bw"><div class="tyrm-b" style="width:${Math.min(100,t.dedNow/t.limit*100)}%"></div></div>
      <div style="font-size:.73rem;color:var(--ink-2);margin-top:10px;line-height:1.7">
        남은 공제 여력 <b style="color:var(--inc)">${won(R(t.room))}</b>${t.toTh>0
          ? ` · 그전에 25% 문턱까지 <b style="color:var(--warn)">${won(R(t.toTh))}</b>를 더 써야 공제가 시작돼요`:``}
      </div>
      <div style="font-size:.66rem;font-weight:700;color:var(--ink-3);margin:15px 0 -5px;letter-spacing:.3px">지금부터 1원의 공제 효과</div>
      <div class="tyn">
        ${nCard("신용카드", mr.credit, t.need15, tyColor("credit"), mr.credit>mr.thirty)}
        ${nCard("체크·현금", mr.thirty, t.need30, tyColor("check"), mr.thirty>mr.credit)}
      </div>
      <div style="font-size:.75rem;color:var(--ink-2);margin-top:13px;line-height:1.7;padding-top:12px;border-top:1px solid var(--line)">${whyTxt}</div>
    </div>`;
  }

  // 4) 핵심 조언 + 연말 예상 공제액
  h+=`<div class="panel"><div class="p-t">앞으로 뭘 쓸까<span class="p-sub">현 추세 기준</span></div>
    ${[adv,...tyNotes(t)].map(x=>`<div class="ins ${x.tone}"><div class="ins-ic">${x.ic}</div>
      <div class="ins-bd"><div class="ins-t">${esc(x.t)}</div><div class="ins-b">${esc(x.b)}</div></div></div>`).join("")}`;
  if(t.salary>0){
    h+=`<div class="ty-facts" style="margin-top:13px">
      <div class="ty-fact"><div class="ty-fact-l">연말 예상 공제액</div><div class="ty-fact-v" style="color:var(--inc)">${won(R(t.ded))}</div></div>
      <div class="ty-fact"><div class="ty-fact-l">지금까지 확정</div><div class="ty-fact-v">${won(R(t.dedNow))}</div></div>
    </div>`;
  }
  h+=`</div>`;

  // 4) 남은 기간 시나리오 비교 — 이 탭의 '비교 분석' 본체
  if(t.salary>0 && t.remain>0 && t.future>0){
    const mx=Math.max(t.scCredit,t.scCheck,1);
    const gap=R(t.scCheck-t.scCredit);
    const bar=(nm,v,col)=>`<div class="tysc-r">
      <div class="tysc-t"><span class="tysc-n">${nm}</span><span class="tysc-v" style="color:${col}">${won(R(v))}</span></div>
      <div class="tysc-bw"><div class="tysc-b" style="width:${Math.max(2,v/mx*100)}%;background:${col}"></div></div></div>`;
    h+=`<div class="panel"><div class="p-t">남은 ${t.remain}개월 비교<span class="p-sub">연말 공제액</span></div>
      <div style="font-size:.75rem;color:var(--ink-3);line-height:1.7;margin:-4px 0 13px">
        지금 페이스(월 ${wonShort(R(t.pace))})로 남은 ${t.remain}개월에 ${won(R(t.future))}를 더 쓴다고 볼 때
      </div>
      <div class="tysc">
        ${bar("전부 체크·현금으로", t.scCheck, tyColor("check"))}
        ${bar("전부 신용카드로", t.scCredit, tyColor("credit"))}
      </div>
      <div style="font-size:.78rem;color:var(--ink-2);margin-top:13px;line-height:1.7;padding-top:12px;border-top:1px solid var(--line)">
        ${gap>0
          ? `체크·현금으로 돌리면 공제가 <b style="color:var(--inc)">${won(gap)}</b> 더 늘어요.`
          : `지금 상황에선 어느 쪽을 써도 공제 차이가 없어요 — ${
              t.ded>=t.limit-1 ? '이미 공제 한도를 채우기 때문'
              : t.Sp<=t.th     ? '연말까지 써도 25% 문턱에 못 미치기 때문'
              /* 신용이 문턱 아래면 추가 지출은 어디에 쓰든 문턱을 밀어낼 뿐이라 한계 공제율이 30%로 같다 */
              : `신용 사용액이 문턱(${won(Math.round(t.th))}) 아래라 어디에 써도 한계 공제율이 30%로 같기 때문`}.`}
      </div></div>`;
  }

  // 5) 월별 사용 추이
  const hasSpend=t.ytd.credit+t.ytd.check+t.ytd.cash>0;
  if(hasSpend){
    _tyStash={
      labels:Array.from({length:t.m},(_,i)=>`${i+1}월`),
      credit:t.byMonth.credit.slice(0,t.m),
      check :t.byMonth.check.slice(0,t.m),
      cash  :t.byMonth.cash.slice(0,t.m),
      pace  :t.salary>0 ? t.th/12 : 0
    };
    h+=`<div class="panel"><div class="p-t">월별 사용 추이<span class="p-sub">신용·체크·현금</span></div>
      <canvas id="chartTyMonth" height="200"></canvas>
      ${t.salary>0?`<div style="font-size:.7rem;color:var(--ink-3);margin-top:10px;line-height:1.6">점선 = 문턱을 12개월로 나눈 월 적정 페이스 ${won(R(t.th/12))}</div>`:``}
    </div>`;
  } else { _tyStash=null; }

  // 6) 소득 카테고리 매핑 · 7) 결제수단 매핑 (설정 탭과 동일한 컨트롤, 여기선 미등록 항목까지 포함)
  h+=taxMapSection(tyMember,"category",t)+taxMapSection(tyMember,"method",t);

  return h+`</div>`;
}

/* 매핑 섹션 빌더 — 소득(카테고리)·지출(결제수단) 공용.
   설정에 등록된 항목이 기준이고, 거래에만 있는 값은 '미등록'으로 분리해 매핑을 유도한다. */
function taxMapSection(member, kind, t){
  const isCat = kind==="category";
  let {registered, unregistered} = tyItems(member, kind);
  const bag  = (isCat?CTMAP:MTMAP)[member]||{};

  const amt=tyAmounts(member, kind);   // 올해 금액 (소득=입금, 지출=지출)
  // 카테고리는 대부분 지출용이라 전부 늘어놓으면 소득과 무관한 행이 대다수가 된다
  // → 입금이 있었거나 이미 지정된 것만. (결제수단은 전부 분류 대상이라 그대로 둔다)
  if(isCat) registered = registered.filter(v=>(amt[v]||0)>0 || bag[v]);
  const nUnmapped = [...registered,...unregistered].filter(v=>!bag[v] && (amt[v]||0)>0).length;

  const row = (v,isReg) => {
    const cur=bag[v]||"", a=amt[v]||0;
    return `<div class="tym">
      <div class="tym-bd">
        <div class="tym-nm">${v?esc(v):'<span style="color:var(--ink-3)">(미지정)</span>'}${isReg?'':' <span class="tym-tag">미등록</span>'}</div>
        <div class="tym-a">${tyAmtLabel(a,isCat,cur)}</div>
      </div>
      ${taxSelect(member,kind,v,cur)}</div>`;
  };

  let h=`<div class="m-section">
    <div class="m-title">${isCat?'소득 카테고리 매핑':'결제수단 매핑'} <span style="font-size:.66rem;color:var(--ink-3);font-weight:600">${esc(member)}</span></div>
    <div style="font-size:.75rem;color:var(--ink-2);line-height:1.75;margin-bottom:12px">
      ${isCat
        ? `어떤 입금을 <b style="color:var(--ink)">급여(총급여)</b>로 볼지 지정합니다. 여기서 소득으로 지정한 카테고리만 25% 문턱 계산에 들어가요.`
        : `'~~카드'만으로는 신용인지 체크인지 알 수 없어서, 수단마다 공제 구분을 지정해야 집계됩니다. <b style="color:var(--ink)">현금</b>은 현금영수증을 발행한 금액만 공제 대상이에요.`}
      <br><span style="color:var(--ink-3)">설정 탭 → ${isCat?'카테고리':'결제수단'} 관리에서도 같은 값을 바꿀 수 있어요.</span>
    </div>`;
  if(nUnmapped){
    h+=`<button class="m-save" style="width:100%;padding:11px;margin-bottom:12px" onclick="applyTaxSuggest('${jsq(member)}','${kind}')">✨ 미분류 ${nUnmapped}개 추천값으로 일괄 분류</button>`;
  }
  if(!registered.length && !unregistered.length){
    h+=`<div class="m-empty">${isCat?'입금 카테고리가 없어요.':'결제수단이 없어요. 설정 탭에서 추가해주세요.'}</div>`;
  } else {
    h+=`<div class="m-list" style="background:none;border:none;padding:0">`;
    h+=registered.map(v=>row(v,true)).join("");
    if(unregistered.length){
      h+=`<div class="tym-grp">⚠️ 설정에 없는 ${isCat?'카테고리':'결제수단'} — 거래엔 쓰였어요</div>`;
      h+=unregistered.map(v=>row(v,false)).join("");
    }
    h+=`</div>`;
  }
  return h+`</div>`;
}

/* ── 연말정산 설정 CRUD ── */
/* type: 'category'(소득) | 'method'(지출). kind 빈값이면 매핑 해제(삭제). */
async function setTaxMap(member, type, value, kind){
  if(!TAX_READY){ toast("tax_map 테이블을 먼저 만들어주세요 (연말정산 탭 설치 안내)"); return; }
  const res = kind
    ? await sb.from("tax_map").upsert({member,type,value,kind},{onConflict:"member,type,value"})
    : await sb.from("tax_map").delete().eq("member",member).eq("type",type).eq("value",value);
  if(dbErr(res,"매핑 저장 오류")) return;
  await reloadAndRender();
}
/* 미분류 항목만 이름 규칙 추천값으로 일괄 저장 —
   추천값을 몰래 집계에 쓰지 않고 저장된 것만 반영한다(근거 없이 숫자가 움직이면 안 되므로) */
async function applyTaxSuggest(member, type){
  if(!TAX_READY){ toast("tax_map 테이블을 먼저 만들어주세요 (연말정산 탭 설치 안내)"); return; }
  const isCat=type==="category";
  const bag=(isCat?CTMAP:MTMAP)[member]||{};
  const {registered,unregistered}=tyItems(member,type);
  // 올해 실제 활동이 있는 항목만 — 활동 없는 카테고리까지 'none'으로 저장하면
  // 그게 '매핑됨'이 되어 소득 목록에 도로 나타난다(화면 노이즈 복귀).
  // 집계는 tyAmounts를 재사용한다 — 화면(taxMapSection)이 '미분류 N개'를 세는 기준과
  // 여기서 실제로 저장하는 기준이 갈라지면, 버튼 숫자와 결과 건수가 어긋난다
  const amt=tyAmounts(member, type);
  const rows=[...registered,...unregistered].filter(v=>!bag[v] && (amt[v]||0)>0)
    .map(v=>({member,type,value:v,kind:isCat?suggestCatKind(v):suggestKind(v)}));
  if(!rows.length){ toast("미분류 항목이 없어요"); return; }
  const res=await sb.from("tax_map").upsert(rows,{onConflict:"member,type,value"});
  if(dbErr(res,"매핑 저장 오류")) return;
  toast(`${rows.length}개 항목을 분류했어요`);
  await reloadAndRender();
}
function copyTaxDDL(){
  const done=()=>toast("SQL을 복사했어요 — Supabase SQL Editor에 붙여넣기");
  if(navigator.clipboard?.writeText) navigator.clipboard.writeText(TAX_MAP_DDL).then(done,()=>toast("복사 실패 — 화면의 SQL을 직접 선택해 복사해주세요"));
  else toast("복사 실패 — 화면의 SQL을 직접 선택해 복사해주세요");
}
async function saveTySalary(member){
  const v=amtVal("ty_sal");
  const key=`ty_salary_${member}`;
  const res = v>0 ? await sb.from("app_settings").upsert({key,value:String(v)},{onConflict:"key"})
                  : await sb.from("app_settings").delete().eq("key",key);
  if(dbErr(res,"총급여 저장 오류")) return;
  toast(v>0?`총급여 ${won(v)}로 저장했어요`:"자동 추정값으로 되돌렸어요");

// 짝 없는 이동 leg 점검 배너 — 잔액이 틀어지는 곳이 계좌 탭이므로 여기에 띄운다
function orphanBanner(){
  const all = orphanTransfers();
  const os  = memberFilter==="전체" ? all : all.filter(r=>r.member===memberFilter);
  if(!os.length) return "";
  const li = os.slice(0,5).map(r=>
    `<div style="margin-top:6px">· ${r.date} · <b>${won(Number(r.amount))}</b> · ${esc(r.account||"미분류")}
     <span style="color:var(--ink-3)">(${r.type==="입금"?"입금":"출금"}만 있음${r.memo?" · "+esc(r.memo):""})</span></div>`).join("");
  return `<div class="warn-card">
    <div class="wc-t">🔗 짝 없는 계좌간 이동 ${os.length}건</div>
    <div class="wc-b">이동은 출금·입금 2건이 한 쌍이어야 해요. 한쪽만 있으면 <b>그 계좌 잔액이 그만큼 틀어지고</b>,
      이동은 수입·지출 통계에서도 빠지기 때문에 그 금액이 화면 어디에도 잡히지 않습니다.<br>
      내역 탭(◀로 해당 주기 이동)에서 짝을 추가하거나, 실제 이동이 아니면 카테고리를 바꿔주세요.
      ${li}${os.length>5?`<div style="margin-top:6px;color:var(--ink-3)">…외 ${os.length-5}건</div>`:""}</div>
  </div>`;
}
function viewAccount(){
  const rows = myRows();
  // 잔액(acct)엔 이동 포함(계좌 간 돈 흐름), 총 수입·지출 표시엔 이동 제외(같은 금액이 양쪽에 잡혀 부풀어 보임)
  let inc=0, exp=0, bal=0, acct={}, cnt={};
  rows.forEach(r=>{
    const a=r.account||"미분류";
    cnt[a]=(cnt[a]||0)+1;
    if(r.type==="입금"){ if(!isTransfer(r))inc+=r.amount; bal+=r.amount; acct[a]=(acct[a]||0)+r.amount; }
    else{ if(!isTransfer(r))exp+=r.amount; bal-=r.amount; acct[a]=(acct[a]||0)-r.amount; }
  });
  let h=`${memberFilterPills()}<div class="sec">${orphanBanner()}
    <div class="acct-tot"><div class="at-l">${memberFilter==="전체"?"전체 합산 잔액":esc(memberFilter)+"의 잔액"}</div><div class="at-v">${won(bal)}</div></div>
    <div class="acct-grid">
      <div class="am"><div class="am-l">총 수입</div><div class="am-v g">+${won(inc)}</div></div>
      <div class="am"><div class="am-l">총 지출</div><div class="am-v r">-${won(exp)}</div></div>
    </div>
    <div class="acct-note">계좌간 이동 제외</div>
    <div class="sec-t">계좌별 잔액<span>${Object.keys(acct).length}개 · 이동 포함</span></div>`;
  if(Object.keys(acct).length){
    // 행마다 '잔액' 라벨을 다시 적으면 바로 위 섹션 제목과 중복된다 → 건수를 대신 보여준다
    Object.entries(acct).forEach(([nm,b])=>h+=`<div class="acard"><div><div class="a-nm">${esc(nm)}</div><div class="a-sub">${cnt[nm]}건</div></div><div class="a-bal ${b>=0?'g':'r'}">${b>=0?'+':''}${won(b)}</div></div>`);
  } else {
    h+=empty("🏦","계좌 데이터가 없어요.");
  }
  return h+`</div>`;
}

      const ico=key==="categories"?`<button class="m-ico" onclick="openIconPicker('${jsq(v)}')" aria-label="아이콘 변경">${icon(v)}</button>`:"";
      const sel = tKind ? taxSelect(masterMember, tKind, v, tBag[v]||"") : "";
      h+=`<div class="m-item"><div style="display:flex;align-items:center;gap:10px;min-width:0">${ico}<span class="m-nm">${esc(v)}</span></div><div style="display:flex;align-items:center;gap:8px;flex-shrink:0">${sel}<button class="m-del" onclick="delMaster('${key}','${jsq(v)}')">삭제</button></div></div>`;
    });
    else h+=`<div class="m-empty">아래에서 항목을 추가해주세요.</div>`;
    h+=`</div>`;

    /* 설정 목록엔 없는데 거래엔 쓰인 값 — 여기 안 띄우면 매핑할 방법이 연말정산 화면뿐이라
       `제일은행카드`(1,140만)처럼 금액이 큰 항목이 설정에서 통째로 안 보인다.
       master_data 행이 없으니 삭제 버튼은 없고, 매핑 셀렉트만 연말정산 화면과 동일하게 준다. */
    if(tKind){
      const unreg = tyItems(masterMember, tKind).unregistered;
      if(unreg.length){
        const tAmt = tyAmounts(masterMember, tKind);
        h+=`<div class="tym-grp">⚠️ 설정 목록엔 없지만 거래에 쓰인 ${label}</div>
          <div style="font-size:.72rem;color:var(--ink-3);margin:6px 0 4px;line-height:1.6">
            아래에서 바로 구분을 지정할 수 있어요. 계속 쓸 항목이면 이름 그대로 위에 추가해두면 목록이 정리됩니다.</div>
          <div class="m-list">`;
        unreg.forEach(v=>{
          const cur=tBag[v]||"", a=tAmt[v]||0;
          h+=`<div class="m-item">
            <div style="min-width:0">
              <div style="display:flex;align-items:center;gap:6px;min-width:0">
                <span class="m-nm" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${v?esc(v):'(미지정)'}</span>
                <span class="tym-tag">미등록</span>
              </div>
              <div class="tym-a">${tyAmtLabel(a, tKind==="category", cur)}</div>
            </div>
            ${taxSelect(masterMember, tKind, v, cur)}</div>`;
        });
        h+=`</div>`;
      }
    }
    h+=`<div class="m-add"><input id="m_input_${key}" placeholder="${label} 추가" onkeydown="if(event.key==='Enter')addMaster('${key}')"><button onclick="addMaster('${key}')">추가</button></div></div>`;
  });

  return h+`</div>`;
}

/* ── 입력 시트 ── */
function refreshCatList(){
  const mdata=MASTER[memberVal]||{categories:[...DEFAULT_CATS],methods:[],accounts:[]};
  const opt=v=>`<option value="${esc(v)}">${esc(v)}</option>`;
  $("fCategory").innerHTML=catsOf(memberVal).map(opt).join("");
  $("fMethod").innerHTML=`<option value="">선택 안함</option>`+mdata.methods.map(opt).join("");
  const acctOpts=`<option value="">계좌 선택</option>`+mdata.accounts.map(opt).join("");
  $("fAccount").innerHTML=acctOpts;
  $("fFromAccount").innerHTML=acctOpts;
  $("fToAccount").innerHTML=acctOpts;
  ["fCategory","fMethod","fAccount","fFromAccount","fToAccount"].forEach(updateSelBtn);
}
function renderMemberSeg(){
  $("memberSeg").innerHTML=segBtns(MEMBERS, memberVal, "setMember");
}
function setMember(m){ memberVal=m; renderMemberSeg(); refreshCatList(); }
function setType(t){
  typeVal=t;
  $("tgExp").className="tg"+(t==="지출"?" tg-e":"");
  $("tgInc").className="tg"+(t==="입금"?" tg-i":"");
  $("tgTrf").className="tg"+(t==="이동"?" tg-t":"");
  const trf = t==="이동";  // 계좌간 이동: 카테고리·결제수단·계좌 숨기고 출금/입금계좌 노출
  $("rowCategory").style.display = trf?"none":"";
  $("rowMethod").style.display   = trf?"none":"";
  $("rowAccount").style.display  = trf?"none":"";
  $("rowFrom").style.display     = trf?"":"none";
  $("rowTo").style.display       = trf?"":"none";
}
function openSheet(){
  if(!MEMBERS.length){ toast("설정에서 멤버를 먼저 추가해주세요"); return; }
  editId=null;
  $("sheetTitle").textContent="내역 추가";
  $("saveBtn").textContent="저장하기";
  $("fMemo").value="";
  $("fDate").value=todayStr(); syncDateDisp();
  $("fAmount").value="";
  $("tgTrf").style.display="";  // 신규 입력에서만 이동 허용
  setType("지출");
  memberVal=memberVal||defMember();
  renderMemberSeg();
  refreshCatList();
  showSheet();
}
function editEntry(id){
  // id로 ROWS에서 조회 — 행 JSON을 onclick 속성에 인라인하면 메모의 따옴표에 깨짐
  const r=ROWS.find(x=>x.id===id); if(!r) return;
  // 계좌간 이동은 2건이 한 쌍 → 단건 수정 시 짝과 어긋나므로 막음(삭제 후 재등록 유도)
  if(isTransfer(r)){ toast("계좌간 이동은 수정할 수 없어요. 삭제 후 다시 추가해주세요"); return; }
  editId=r.id;
  $("sheetTitle").textContent="내역 수정";
  $("saveBtn").textContent="수정하기";
  $("tgTrf").style.display="none";  // 수정 시엔 이동 불가(단건 수정)
  setType(r.type);
  memberVal=r.member||MEMBERS[0];
  renderMemberSeg();
  refreshCatList();
  $("fDate").value=r.date; syncDateDisp();
  $("fAmount").value=comma(r.amount);
  ensureOpt("fCategory",r.category);
  ensureOpt("fMethod",r.method);
  ensureOpt("fAccount",r.account);
  updateSelBtn("fCategory"); updateSelBtn("fMethod"); updateSelBtn("fAccount");
  $("fMemo").value=r.memo||"";
  showSheet();
}
// 마스터에서 삭제된 값이라도 수정 시 그대로 유지되도록 — select에 없으면 옵션 임시 추가
function ensureOpt(selId,val){
  const sel=$(selId);
  if(val && ![...sel.options].some(o=>o.value===val)) sel.add(new Option(val,val));
  sel.value=val||"";
}
function showSheet(){ $("overlay").classList.add("open"); document.body.classList.add("sheet-open"); }
function closeSheet(){ $("overlay").classList.remove("open"); document.body.classList.remove("sheet-open"); editId=null; }
$("fAmount").addEventListener("input",e=>fmtNum(e.target));

/* ESC 키로 열린 레이어 닫기 (피커 → 기기사용자 모달 → 입력 시트 순) */
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape") return;
  if($("pickerOv").classList.contains("open")) closePicker();
  else if($("pwOv").classList.contains("open")) closePwChange();
  else if($("duOv").classList.contains("open")) closeDeviceUser();
  else if($("overlay").classList.contains("open")) closeSheet();
  // authOv(로그인 게이트)는 의도적으로 제외 — ESC로 닫히면 게이트가 아니다
});

/* ── 커스텀 피커 ── */
let pickerSel = null;
function openPicker(selId, title){
  pickerSel = selId;
  const sel = $(selId);
  const opts = Array.from(sel.options);
  $("pickerTitle").textContent = title;
  if(!opts.length){
    $("pickerOpts").innerHTML = '<div style="padding:24px 20px;text-align:center;color:var(--ink-3);font-size:.85rem">항목이 없어요. 설정에서 추가해주세요.</div>';
  } else {
    $("pickerOpts").innerHTML = opts.map((o,i)=>
      `<div class="picker-opt${sel.value===o.value?' on':''}" onclick="pickOptIdx(${i})">${esc(o.text)}</div>`
    ).join("");
  }
  $("overlay").style.overflow = "hidden";  // 배경(입력 시트) 스크롤 잠금
  $("pickerOv").classList.add("open");
}
function pickOptIdx(idx){
  if(!pickerSel) return;
  const sel = $(pickerSel);
  sel.selectedIndex = idx;
  updateSelBtn(pickerSel);
  closePicker();
}
function closePicker(){
  $("pickerOv").classList.remove("open");
  $("overlay").style.overflow = "";  // 배경 스크롤 잠금 해제
  // 입력 시트가 열려 있으면(시트 위 피커) body 잠금은 시트 몫이라 유지, 아니면 해제
  if(!$("overlay").classList.contains("open")) document.body.classList.remove("sheet-open");
  pickerSel = null; iconCat = null;
}
function updateSelBtn(selId){
  const sel = $(selId);
  const disp = $(selId+"Disp");
  if(!sel||!disp) return;
  const opt = sel.options[sel.selectedIndex];
  disp.textContent = opt ? opt.text : "선택";
}
</script>
