<!-- ── 네트워크 태그는 무조건 <head> 맨 앞 ──
     아래 apple-touch-icon이 base64 26KB짜리 한 줄이라, 이 태그들이 그 뒤에 있으면
     preload 스캐너가 26KB를 다 받은 뒤에야 CDN·DB를 발견한다(실측: 발견이 문서 끝까지 밀렸다). -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<!-- DB에도 preconnect: 첫 쿼리는 DOMContentLoaded 이후에 나가는데, 그때 DNS+TCP+TLS를
     처음부터 하면 실측 ~290ms를 그 자리에서 쓴다(TCP 275ms·TLS 288ms, 서울 PoP 기준).
     핸드셰이크를 HTML 파싱 중에 미리 끝내두면 첫 쿼리가 곧장 나간다. -->
<link rel="preconnect" href="https://hqyvkyflakhuvethrstw.supabase.co" crossorigin>
<!-- Pretendard: @import(직렬·렌더블로킹) 대신 <link>로 — preload 스캐너가 일찍 발견 -->
<!-- static(통파일) 금지: weight마다 한글 전체 woff2를 받아 4개 = 3.15MB였다(2026-08-15 실측).
     variable + dynamic-subset = 유니코드 범위 92조각 중 쓰는 것만 + 한 파일이 45~920 전 weight 담당. -->
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<!-- defer: HTML 파싱을 막지 않음(헤더·스피너 즉시 페인트). DOMContentLoaded 이후에만 쓰여 안전.
     ⚠️ 여기에 chart.js를 다시 추가하지 말 것 — defer는 DOMContentLoaded를 막으므로
     분석 탭 전용 라이브러리가 첫 DB 요청 앞에 줄을 선다. 지연 로드는 ensureChart(). -->
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* Pretendard는 위 <head>의 <link>로 로드 (여기서 @import 하면 직렬·렌더블로킹) */

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* ══════════════════════════════════════════════════════════════
   디자인 토큰 — 라이트가 기본, 다크는 OS 설정일 때만
   계약: docs/superpowers/specs/2026-08-24-light-redesign-design.md
   검사: node scripts/check_theme.js

   ⚠️ 색 예산은 3종뿐이다. 늘리지 말 것.
      ① --exp 지출  ② --inc 수입  ③ --s1..6 차트 카테고리
      나머지는 전부 무채색이다. 액센트조차 --ink 다 —
      초록을 액센트로 쓰면 '수입'과 '선택됨' 두 뜻이 겹쳐
      분류 배지·한도 바가 무엇을 뜻하는지 알 수 없어진다.
   ══════════════════════════════════════════════════════════════ */
:root{
  color-scheme:light;
  --bg:#FFFFFF;
  --fill:#F4F4F2;      /* 아이콘 웰·칩 배경 */
  --fill-2:#EAEAE7;    /* 진행바 트랙·눌림 */
  --ink:#14161A;       /* 본문·제목·액센트(선택됨) */
  --ink-2:#5A6068;     /* 보조 텍스트 */
  --ink-3:#8A9099;     /* 마이크로 라벨 — 3.22:1, 본문에 쓰지 말 것 */
  --line:#E4E5E7;      /* 1px 룰선 */
  --line-2:#CFD2D6;    /* 섹션 경계·입력 테두리 */
  --exp:#C0392B;       /* 지출 금액 — 오직 이 뜻 */
  --inc:#0F6B4F;       /* 수입 금액 — 오직 이 뜻 */
  --warn:#9A5B14;      /* 한도 임박 */
  --on-ink:#FFFFFF;    /* 잉크 채움 위 글자 */
  /* 차트 카테고리 — validate_palette.js 6검사 전 항목 PASS (surface #FFFFFF).
     ⚠️ 시맨틱 예약색(빨강·초록)은 슬롯에 넣지 않는다. */
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --s4:#eda100; --s5:#e87ba4; --s6:#4a3aa7;
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --bg:#101215;
    --fill:#1E2126;
    --fill-2:#262A30;
    --ink:#E9EBEE;
    --ink-2:#A2A8B0;
    --ink-3:#767D86;
    --line:#272B31;
    --line-2:#373C44;
    --exp:#FF7A6B;
    --inc:#4FCB96;
    --warn:#D9A054;
    --on-ink:#101215;
    /* 같은 6색을 다크 서피스(#101215)에 다시 스텝한 것 — 자동 반전이 아니다 */
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --s4:#c98500; --s5:#d55181; --s6:#9085e9;
  }
}

html{font-size:16px;-webkit-text-size-adjust:100%}
body{
  /* 'Pretendard Variable'이 위 dynamic-subset의 실제 패밀리명. 그 뒤는 로컬 설치본 폴백 */
  font-family:'Pretendard Variable','Pretendard','Noto Sans KR',-apple-system,sans-serif;
  background:var(--bg);color:var(--ink);
  line-height:1.55;-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums; /* 금액·날짜 숫자 폭 고정 — 목록 정렬감 */
}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}

.app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ── 헤더 ── */
.hd{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;
  background:var(--bg);
  border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:20;
}
.hd-l{display:flex;align-items:center;gap:10px}
.logo-s{
  width:28px;height:28px;border-radius:7px;
  background:var(--ink);color:var(--on-ink);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.logo-s svg{width:17px;height:17px}
.hd-t{font-size:.9375rem;font-weight:650;letter-spacing:-.02em;color:var(--ink)}
.hd-r{display:flex;align-items:center;gap:6px}
.hd-chip{
  display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:8px;
  border:1px solid var(--line-2);color:var(--ink-2);background:var(--bg);
  font-size:.75rem;font-weight:550;white-space:nowrap;transition:color .15s,border-color .15s;
}
.hd-chip:active{border-color:var(--ink);color:var(--ink)}
.hd-chip svg{width:13px;height:13px;flex-shrink:0}
.hd-btn{
  width:32px;height:32px;border-radius:8px;flex-shrink:0;
  background:var(--bg);border:1px solid var(--line-2);color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;transition:color .15s,border-color .15s;
}
.hd-btn:active{border-color:var(--ink);color:var(--ink)}
.hd-btn svg{width:15px;height:15px}
.hd-btn.rot svg{animation:sp .75s linear infinite;color:var(--ink)}

/* ── 네비 (하단 고정 탭바) ──
   선택 표시는 색이 아니라 잉크 + 상단 2px 인디케이터다. */
.nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;
  display:flex;
  background:var(--bg);
  border-top:1px solid var(--line-2);
  padding:0 4px calc(8px + env(safe-area-inset-bottom,0px));
  z-index:30;
}
.tab{
  flex:1;min-width:0;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 0 2px;
  font-size:.6875rem;font-weight:550;color:var(--ink-3);
  border-top:2px solid transparent;margin-top:-1px;
  transition:color .15s;
}
.tab.on{color:var(--ink);border-top-color:var(--ink);font-weight:650}
.tab:active{color:var(--ink-2)}
.tab-ic{display:flex;align-items:center;justify-content:center;width:44px;height:22px}
.tab-ic svg{width:19px;height:19px}
.tab.on .tab-ic{background:none}

/* ── 필터 ── */
.filter{display:flex;gap:6px;padding:14px 20px 0;overflow-x:auto;scrollbar-width:none}
.filter::-webkit-scrollbar{display:none}
.pill{
  flex-shrink:0;padding:6px 13px;border-radius:8px;
  font-size:.8125rem;font-weight:550;
  border:1px solid var(--line-2);color:var(--ink-2);background:transparent;
  white-space:nowrap;transition:all .15s;
}
.pill.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink);font-weight:600}
.pill.dis{opacity:.35;pointer-events:none}
.sec{padding:0 20px}
.g{color:var(--inc)}.r{color:var(--exp)}

/* ── 주기 네비 (◀ 기간 ▶) ── */
.pnav{
  display:flex;align-items:center;justify-content:space-between;
  margin:14px 20px 0;padding:9px 4px;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
}
.pnav button{width:30px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
.pnav button svg{width:15px;height:15px}
.pnav button:disabled{color:var(--line-2)}
.pnav-t{font-size:.8125rem;font-weight:600;letter-spacing:-.01em}

/* ── 내역 검색 ── */
.searchw{padding:14px 20px 0}
.searchw>div{position:relative}
.search-inp{
  width:100%;padding:10px 38px 10px 13px;
  border:1px solid var(--line-2);border-radius:8px;
  background:var(--bg);color:var(--ink);font-family:inherit;font-size:.875rem;
  outline:none;transition:border-color .15s;
}
.search-inp::placeholder{color:var(--ink-3)}
.search-inp:focus{border-color:var(--ink)}
.search-x{
  position:absolute;right:5px;top:50%;transform:translateY(-50%);
  width:30px;height:30px;border-radius:6px;
  background:var(--fill);color:var(--ink-2);font-size:.72rem;
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
}

/* ── 요약 — 카드 박스 대신 세로 룰선 2칸 ── */
.cards{display:flex;margin:0 20px;border-bottom:1px solid var(--line)}
.card{flex:1;padding:16px 0 15px;background:none;border:none;border-radius:0}
.card+.card{border-left:1px solid var(--line);padding-left:16px}
.card.inc .c-v{color:var(--inc)}
.card.exp .c-v{color:var(--exp)}
.c-lb{font-size:.6875rem;font-weight:600;color:var(--ink-3);margin-bottom:3px;letter-spacing:.01em}
.c-v{font-size:1.1875rem;font-weight:700;letter-spacing:-.03em}

/* ── 날짜 그룹 / 내역 행 ── */
.dgroup{margin-bottom:0}
.dhead{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:20px 0 7px;
  border-bottom:1px solid var(--line-2);
  font-size:.8125rem;font-weight:650;color:var(--ink);letter-spacing:-.01em;
}
.dtot{font-size:.75rem;color:var(--ink-3);font-weight:550}
.item{
  display:flex;gap:11px;align-items:flex-start;
  padding:13px 0;
  border-bottom:1px solid var(--line);
  background:none;border-radius:0;
  transition:opacity .15s;
}
.item:active{opacity:.6}
.i-ic{
  width:34px;height:34px;min-width:34px;
  border-radius:8px;background:var(--fill);
  display:flex;align-items:center;justify-content:center;font-size:1rem;
}
.i-bd{flex:1;min-width:0}
.i-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.i-cat{font-size:.9375rem;font-weight:500;line-height:1.35;letter-spacing:-.01em}
.i-amt{font-size:.9375rem;font-weight:600;white-space:nowrap;letter-spacing:-.02em}
/* 서브텍스트 한 줄 — 옛 칩 3개를 가운뎃점으로 이었다.
   수정·삭제는 별도 행이 아니라 이 줄의 오른쪽 끝에 붙어 행을 2줄로 유지한다. */
.i-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:1px}
.i-sub{flex:1;min-width:0;font-size:.8125rem;color:var(--ink-3);font-weight:450;line-height:1.5}
.i-sub .memo{color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{
  font-size:.75rem;color:var(--ink-3);background:none;
  padding:0;border:none;font-weight:450;
}
.chip.mem{color:var(--ink-2);font-weight:550}
.chip.trf{color:var(--s1);font-weight:600}
.i-memo{font-size:.8125rem;color:var(--ink-2);margin-top:2px;line-height:1.5}
/* 테두리 없는 텍스트 버튼 — 행마다 상자가 2개씩 뜨면 룰선 리스트가 도로 카드처럼 보인다.
   ⚠️ 없애지는 말 것: 계좌간 이동은 수정이 막혀 있어 여기 삭제가 유일한 제거 수단이다. */
.i-act{display:flex;gap:10px;flex-shrink:0;padding-bottom:1px}
.b-edit,.b-del{padding:2px 0;font-size:.75rem;font-weight:550;border:none;background:none;transition:color .15s}
.b-edit{color:var(--ink-3)}
.b-edit:hover{color:var(--ink)}
.b-del{color:var(--ink-3)}
.b-del:hover{color:var(--exp)}

/* ── 분류 행 ── */
.ccard{
  background:none;border:none;border-bottom:1px solid var(--line);border-radius:0;
  padding:13px 0;margin-bottom:0;transition:opacity .15s;
}
.ccard.link{cursor:pointer}
.ccard.link:active{opacity:.6}
.c-h{display:flex;align-items:center;gap:10px;margin-bottom:0}
.c-sub{font-size:.75rem;color:var(--ink-3);margin-top:5px;font-weight:450}
.c-pct{font-size:.75rem;font-weight:600;color:var(--ink-3);min-width:30px;text-align:right}
.c-l{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.c-ic{
  width:30px;height:30px;min-width:30px;
  border-radius:8px;background:var(--fill);
  display:flex;align-items:center;justify-content:center;font-size:.9375rem;
}
.c-nm{font-size:.9375rem;font-weight:500;letter-spacing:-.01em}
/* 증감은 색 배지가 아니라 텍스트로 — 액센트 무채색 원칙 */
.c-bd{font-size:.75rem;font-weight:600;white-space:nowrap;padding:0;border-radius:0;background:none}
.bg{color:var(--inc)}.br{color:var(--exp)}
.c-st{display:flex;align-items:center;gap:9px;margin-top:9px}
.barw{flex:1;height:3px;background:var(--fill-2);border-radius:2px;overflow:hidden}
.bar{height:3px;border-radius:2px;background:var(--ink-2);transition:width .4s}
.sec-t{
  display:flex;justify-content:space-between;align-items:baseline;
  font-size:.8125rem;font-weight:650;color:var(--ink);letter-spacing:-.01em;
  padding:22px 0 8px;border-bottom:1px solid var(--line-2);
}

/* ── 한도 ── */
.alert{
  background:color-mix(in srgb,var(--exp) 7%,transparent);
  border:1px solid color-mix(in srgb,var(--exp) 28%,transparent);
  color:var(--exp);border-radius:8px;padding:12px 14px;
  font-size:.8125rem;font-weight:600;margin-bottom:12px;
}
.lcard{
  background:none;border:none;border-bottom:1px solid var(--line);border-radius:0;
  padding:15px 0;margin-bottom:0;
}
.lcard.over,.lcard.warn{background:none;border-color:var(--line)}
.l-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.l-pct{font-size:.9375rem;font-weight:650;letter-spacing:-.02em}
.l-pct.ok{color:var(--ink-2)}.l-pct.warn{color:var(--warn)}.l-pct.over{color:var(--exp)}
.l-bar-w{height:5px;background:var(--fill-2);border-radius:3px;overflow:hidden;margin-bottom:7px}
.l-bar{height:5px;border-radius:3px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.l-bar.ok{background:var(--ink-2)}
.l-bar.warn{background:var(--warn)}
.l-bar.over{background:var(--exp)}
.l-meta{display:flex;justify-content:space-between;gap:8px;font-size:.8125rem;font-weight:600;align-items:baseline;color:var(--ink-2)}
.l-lim{color:var(--ink-3);font-weight:450}
.l-msg{margin-top:5px;font-size:.75rem;font-weight:550;color:var(--exp)}
.l-msg.warn{color:var(--warn)}
.l-edit{margin-top:11px;display:flex;gap:8px}
.l-edit input{
  flex:1;padding:9px 12px;border:1px solid var(--line-2);border-radius:8px;
  background:var(--bg);color:var(--ink);font-family:inherit;font-size:.84rem;
  outline:none;transition:border-color .15s;
}
.l-edit input:focus{border-color:var(--ink)}
/* 반복되는 보조 액션은 아웃라인 — 솔리드 잉크는 주 액션(저장하기·로그인)에만 남긴다.
   한 화면에 검정 버튼이 7개 뜨면 어느 것이 주 액션인지 사라진다. */
.l-edit button{
  padding:9px 15px;border-radius:8px;background:transparent;color:var(--ink);
  font-weight:600;font-size:.78rem;border:1px solid var(--line-2);transition:border-color .15s;
}
.l-edit button:hover{border-color:var(--ink)}

/* ── 분석 ── */
.panel{
  background:none;border:none;border-radius:0;
  padding:0;margin-bottom:0;
}
.p-t{
  display:flex;align-items:baseline;gap:8px;
  font-size:.8125rem;font-weight:650;letter-spacing:-.01em;
  padding:22px 0 8px;border-bottom:1px solid var(--line-2);margin-bottom:0;
}
.p-sub{font-size:.75rem;font-weight:500;color:var(--ink-3);margin-left:auto;
  background:none;border:none;padding:0;border-radius:0}
.p-body{font-size:.8125rem;line-height:1.9;color:var(--ink-2);white-space:pre-line;padding-top:12px}
.arow{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.arow:last-child{border:none}
.a-mo{flex:1;font-size:.875rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:450}
.a-tag{font-size:.6875rem;font-weight:600;padding:1px 7px;border-radius:6px;border:1px solid var(--line-2);color:var(--ink-3)}
.a-tag.rec{background:var(--fill);color:var(--ink-2)}
.a-tag.one{background:var(--fill);color:var(--ink-2)}
.a-v{font-size:.875rem;font-weight:600;white-space:nowrap;letter-spacing:-.02em}

/* 분석 요약 메트릭 — 세로 룰선으로 나눈 칸 */
.astat{display:flex;margin-bottom:0;border-bottom:1px solid var(--line)}
.astat .am{flex:1;position:relative;padding:15px 0 14px;background:none;border:none;border-radius:0}
.astat .am+.am{border-left:1px solid var(--line);padding-left:14px}
.astat .am-l{margin-bottom:3px}
.astat .am-v{font-size:1.0625rem;font-weight:700;letter-spacing:-.03em;margin-top:1px}
.am-sub{font-size:.6875rem;font-weight:550;color:var(--ink-3);margin-top:5px}
.am-d{display:inline-flex;align-items:center;gap:2px;font-size:.6875rem;font-weight:700;padding:0}
.am-d.r{color:var(--exp)}
.am-d.g{color:var(--inc)}
.am-d.f{color:var(--ink-3)}

/* 도넛 차트 (중앙 총액 + 커스텀 범례) */
.donut-wrap{position:relative;max-width:220px;margin:22px auto 0}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.dc-l{font-size:.6875rem;color:var(--ink-3);font-weight:600}
.dc-v{font-size:1.25rem;font-weight:700;color:var(--ink);letter-spacing:-.03em;margin-top:1px}
/* 범례 = 직접 라벨. 라이트에서 --s3/--s4/--s5 가 흰 배경 대비 3:1 미만이라
   식별이 색에만 의존하면 안 된다(dataviz relief rule). 이름+금액을 반드시 함께 낸다. */
.dlegend{display:flex;flex-direction:column;gap:0;margin-top:18px}
.dlg{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.875rem}
.dlg:last-child{border-bottom:none}
.dlg-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0}
.dlg-nm{color:var(--ink);font-weight:450;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlg-v{color:var(--ink);font-weight:600;letter-spacing:-.02em}
.dlg-p{color:var(--ink-3);font-weight:550;font-size:.75rem;min-width:34px;text-align:right}

/* 스마트 분석 인사이트 */
.ins{display:flex;gap:11px;padding:14px 0;border-bottom:1px solid var(--line)}
.ins:last-child{border:none}
.ins-ic{width:30px;height:30px;min-width:30px;border-radius:8px;background:var(--fill);display:flex;align-items:center;justify-content:center;font-size:.9375rem}
.ins-bd{flex:1;min-width:0}
.ins-t{font-size:.875rem;font-weight:600;margin-bottom:2px;line-height:1.45;letter-spacing:-.01em}
.ins-b{font-size:.8125rem;color:var(--ink-2);line-height:1.6;font-weight:450}
.ins.warn .ins-ic{background:var(--fill)}
.ins.warn .ins-t{color:var(--exp)}
.ins.tip .ins-ic{background:var(--fill)}
.ins.tip .ins-t{color:var(--ink)}
.ins.good .ins-ic{background:var(--fill)}
.ins.good .ins-t{color:var(--inc)}

/* ── 계좌 ── */
.acct-tot{
  border-radius:0;padding:26px 0 22px;margin-bottom:0;
  background:none;border-bottom:1px solid var(--line-2);
  position:relative;
}
.at-l{font-size:.6875rem;font-weight:600;color:var(--ink-3);margin-bottom:5px;letter-spacing:.01em}
.at-v{font-size:2.125rem;font-weight:700;color:var(--ink);letter-spacing:-.045em;line-height:1.1}
.acct-grid{display:flex;gap:18px;margin:14px 0 0}
.acct-note{font-size:.75rem;color:var(--ink-3);margin-top:5px;font-weight:450}
.am{background:none;border:none;border-radius:0;padding:0}
.am-l{font-size:.6875rem;font-weight:600;color:var(--ink-3);margin-bottom:2px;letter-spacing:.01em}
.am-v{font-size:.9375rem;font-weight:600;letter-spacing:-.02em}
.acard{
  background:none;border:none;border-bottom:1px solid var(--line);border-radius:0;
  padding:14px 0;margin-bottom:0;
  display:flex;justify-content:space-between;align-items:center;gap:10px;
}
.a-nm{font-size:.9375rem;font-weight:500;letter-spacing:-.01em}
.a-sub{font-size:.75rem;color:var(--ink-3);margin-top:1px;font-weight:450}
.a-bal{font-size:.9375rem;font-weight:600;letter-spacing:-.02em;white-space:nowrap}

/* ── FAB ── */
.fab{
  position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));
  right:calc(50% - 240px + 20px);
  width:48px;height:48px;
  background:var(--ink);color:var(--on-ink);border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.14);
  z-index:30;display:flex;align-items:center;justify-content:center;
  transition:transform .15s;
}
.fab svg{width:22px;height:22px}
.fab:active{transform:scale(.94)}
@media(max-width:480px){.fab{right:20px}}

.toast{
  position:fixed;bottom:calc(146px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--on-ink);border:none;
  padding:10px 20px;border-radius:8px;
  font-size:.8125rem;font-weight:600;
  z-index:40;opacity:0;transition:opacity .22s;
  pointer-events:none;white-space:nowrap;
  box-shadow:0 2px 8px rgba(0,0,0,.14);
}
.toast.show{opacity:1}

.empty{text-align:center;padding:60px 20px;color:var(--ink-3)}
.e-ic{font-size:2.2rem;margin-bottom:12px;opacity:.5}
.empty p{font-size:.84rem;line-height:1.9}

.spin{
  width:24px;height:24px;
  border:2px solid var(--line);border-top-color:var(--ink);
  border-radius:50%;animation:sp .75s linear infinite;margin:72px auto;
}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── 오버레이 / 시트 ── */
.overlay{display:none;position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.overlay.open{display:block}
body.sheet-open{overflow:hidden}
.sheet{max-width:480px;margin:0 auto;min-height:100dvh}
.s-top{
  display:flex;justify-content:space-between;align-items:center;
  padding:15px 20px;
  background:var(--bg);
  border-bottom:1px solid var(--line);position:sticky;top:0;
}
.s-t{font-size:.9375rem;font-weight:650;letter-spacing:-.02em}
.s-x{
  background:var(--bg);border:1px solid var(--line-2);border-radius:8px;
  color:var(--ink-2);font-size:.79rem;font-weight:600;padding:7px 14px;
  transition:color .15s,border-color .15s;
}
.s-x:hover{border-color:var(--ink);color:var(--ink)}
.s-bd{padding:20px 20px 56px}

.frow{margin-bottom:16px}
.flb{
  font-size:.6875rem;font-weight:600;color:var(--ink-3);
  letter-spacing:.01em;
  margin-bottom:7px;display:block;
}
.inp{
  width:100%;padding:12px 14px;
  border:1px solid var(--line-2);border-radius:8px;
  font-size:.9375rem;font-family:inherit;color:var(--ink);
  background:var(--bg);outline:none;appearance:none;
  transition:border-color .15s,box-shadow .15s;
}
.inp:focus{border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 9%,transparent)}
.inp option{background:var(--bg)}

/* 날짜 — 네이티브 <input type=date> 를 투명하게 덮고 표시는 .date-disp 가 담당한다.
   브라우저가 그리는 'yyyy. mm. dd.' 는 OS 로케일 소관이라 CSS·lang 속성으로 못 바꾼다(실측).
   검증: node scripts/test_date_field.js */
.datew{position:relative}
.date-native{
  position:absolute;inset:0;width:100%;height:100%;
  opacity:0;                    /* ⚠️ display:none·visibility:hidden 이면 탭을 못 받는다 */
  /* ⚠️ 여기에 pointer-events:none 을 붙이지 말 것 — 폰에서 날짜를 아예 못 고르게 된다.
     투명 입력을 '정리'하다 나기 쉬운 실수라, test_date_field.js 가 이 경우로 FAIL 하는 것을 확인해 뒀다. */
  border:none;background:none;padding:0;margin:0;
  font-size:16px;               /* iOS 가 16px 미만 입력에 포커스하면 화면을 확대한다 */
  font-family:inherit;color:inherit;
}
.date-disp{
  display:block;
  /* 탭을 아래 네이티브 입력으로 통과시킨다. 지금은 입력이 DOM 뒤라 없어도 동작하지만,
     이게 있어야 순서가 바뀌어도 안전하다(실측으로 확인) — 지우지 말 것. */
  pointer-events:none;
  min-height:calc(1.55em + 26px);      /* .inp 의 padding 12px×2 + line-height */
}
.date-disp.ph{color:var(--ink-3)}      /* 값이 없을 때 */
.datew:focus-within .date-disp{
  border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 9%,transparent);
}

.toggle{display:flex;gap:8px}
.tg{
  flex:1;padding:12px;border:1px solid var(--line-2);border-radius:8px;
  font-size:.9375rem;font-weight:550;background:var(--bg);color:var(--ink-2);
  transition:all .15s;
}
.tg.tg-e{background:color-mix(in srgb,var(--exp) 8%,transparent);border-color:var(--exp);color:var(--exp);font-weight:650}
.tg.tg-i{background:color-mix(in srgb,var(--inc) 8%,transparent);border-color:var(--inc);color:var(--inc);font-weight:650}
.tg.tg-t{background:color-mix(in srgb,var(--s1) 8%,transparent);border-color:var(--s1);color:var(--s1);font-weight:650}

/* 금액 빠른 입력 칩 */
.qamt{display:flex;gap:6px;margin-top:8px}
.qamt button{
  flex:1;min-width:0;padding:8px 2px;
  border:1px solid var(--line-2);border-radius:8px;
  background:var(--bg);color:var(--ink-2);font-size:.74rem;font-weight:600;
  white-space:nowrap;transition:all .15s;
}
.qamt button:active{border-color:var(--ink);color:var(--ink);background:var(--fill)}

.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{
  flex:1;min-width:80px;padding:11px;
  border:1px solid var(--line-2);border-radius:8px;
  font-weight:550;background:var(--bg);color:var(--ink-2);transition:all .15s;
  font-size:.9rem;
}
.seg button.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink);font-weight:650}

.submit{
  width:100%;padding:14px;
  background:var(--ink);color:var(--on-ink);
  border-radius:8px;font-size:.9375rem;font-weight:650;margin-top:8px;
  transition:opacity .15s,transform .15s;
}
.submit:active{transform:translateY(1px);opacity:.85}
.submit:disabled{opacity:.5;cursor:not-allowed}

/* ── 마스터 데이터 관리 ── */
.m-section{
  background:none;border:none;border-radius:0;
  padding:0;margin-bottom:0;
}
.m-title{
  font-size:.8125rem;font-weight:650;color:var(--ink);letter-spacing:-.01em;
  padding:22px 0 8px;border-bottom:1px solid var(--line-2);margin-bottom:0;
  display:flex;align-items:center;gap:8px;
}
.m-list{margin-bottom:12px}
.m-item{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:11px 0;border-bottom:1px solid var(--line);
}
.m-item:last-child{border:none}
.m-nm{font-size:.875rem;color:var(--ink);font-weight:450}
.m-del{
  color:var(--ink-3);font-size:.72rem;font-weight:600;
  padding:4px 10px;background:transparent;
  border-radius:6px;border:1px solid var(--line-2);transition:all .15s;
}
.m-del:hover{color:var(--exp);border-color:color-mix(in srgb,var(--exp) 40%,transparent)}
.m-empty{font-size:.8rem;color:var(--ink-3);padding:12px 0;text-align:center}
.m-add{display:flex;gap:8px;padding-bottom:4px}
.m-add input{
  flex:1;padding:10px 12px;border:1px solid var(--line-2);border-radius:8px;
  background:var(--bg);color:var(--ink);font-family:inherit;font-size:.85rem;
  outline:none;transition:border-color .15s;
}
.m-add input:focus{border-color:var(--ink)}
.m-add button{
  padding:10px 15px;border-radius:8px;background:transparent;color:var(--ink);
  font-weight:600;font-size:.82rem;border:1px solid var(--line-2);
  transition:border-color .15s;white-space:nowrap;
}
.m-add button:hover{border-color:var(--ink)}
.m-save{
  padding:9px 13px;border-radius:8px;background:transparent;color:var(--ink);
  font-weight:600;font-size:.78rem;border:1px solid var(--line-2);
  transition:border-color .15s;white-space:nowrap;
}
.m-save:hover{border-color:var(--ink)}
/* 카테고리 아이콘 편집 버튼 (설정 탭) */
.m-ico{
  width:34px;height:34px;min-width:34px;border-radius:8px;
  background:var(--fill);border:1px solid var(--line);font-size:1rem;
  display:flex;align-items:center;justify-content:center;transition:all .15s;
}
.m-ico:active{border-color:var(--ink)}
/* 앱 설정 행 */
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border:none}
.set-nm{font-size:.875rem;color:var(--ink);font-weight:450}
.set-ds{font-size:.75rem;color:var(--ink-3);margin-top:2px;line-height:1.5}
.set-in{
  width:62px;text-align:center;padding:9px 6px;
  border:1px solid var(--line-2);border-radius:8px;
  background:var(--bg);color:var(--ink);font-family:inherit;font-size:.85rem;outline:none;
}
.set-in:focus{border-color:var(--ink)}
/* 이모지 선택 그리드 (아이콘 피커) */
.emo-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:16px 20px 10px}
.emo{
  font-size:1.4rem;padding:9px 0;text-align:center;border-radius:8px;
  background:var(--fill);border:1px solid var(--line);transition:all .12s;
}
.emo.on{border-color:var(--ink);background:var(--fill-2)}
.emo:active{transform:scale(.9)}

/* ── 에러 / 경고 카드 ── */
.err-card{
  background:color-mix(in srgb,var(--exp) 6%,transparent);
  border:1px solid color-mix(in srgb,var(--exp) 28%,transparent);
  border-radius:8px;padding:18px 16px;margin-top:16px;
}
/* 앱은 계속 쓸 수 있으나 화면 숫자를 의심해야 하는 상태 */
.warn-card{
  background:color-mix(in srgb,var(--warn) 8%,transparent);
  border:1px solid color-mix(in srgb,var(--warn) 32%,transparent);
  border-radius:8px;padding:14px 16px;margin-bottom:14px;
}
.wc-t{font-size:.875rem;font-weight:650;color:var(--warn);margin-bottom:6px}
.wc-b{font-size:.8125rem;color:var(--ink-2);line-height:1.65}
.wc-b b{color:var(--ink);font-weight:600}
.wc-btn{
  margin-top:11px;padding:9px 15px;background:var(--ink);color:var(--on-ink);
  border:1px solid var(--ink);border-radius:8px;font-weight:600;font-size:.8rem;
}

/* ── 커스텀 셀렉트 ── */
.sel-btn{
  width:100%;padding:12px 14px;
  border:1px solid var(--line-2);border-radius:8px;
  font-size:.9375rem;font-family:inherit;color:var(--ink);
  background:var(--bg);text-align:left;
  display:flex;justify-content:space-between;align-items:center;
  transition:border-color .15s,box-shadow .15s;
}
.sel-btn:active{border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 9%,transparent)}
.sel-arr{color:var(--ink-3);flex-shrink:0;margin-left:8px;display:flex;align-items:center}
.sel-arr svg{width:16px;height:16px}
.picker-ov{
  position:fixed;inset:0;z-index:60;
  background:rgba(0,0,0,0);
  display:flex;align-items:flex-end;justify-content:center;
  visibility:hidden;
  transition:background .28s ease, visibility 0s linear .28s;
}
.picker-ov.open{
  /* 다크에선 페이지가 이미 어두워 .45 로는 뒤 화면이 눌리지 않는다 */
  background:rgba(0,0,0,.58);
  visibility:visible;
  transition:background .28s ease, visibility 0s;
}
.picker-sht{
  width:100%;max-width:480px;
  background:var(--bg);border-radius:14px 14px 0 0;
  border:1px solid var(--line-2);border-bottom:none;
  box-shadow:0 -4px 24px rgba(0,0,0,.22);   /* 시트가 뜬 면임을 알리는 1단계 */
  max-height:65vh;max-height:65dvh;            /* dvh: 모바일 툴바 가려짐 방지 */
  display:flex;flex-direction:column;overflow:hidden;
  padding-bottom:env(safe-area-inset-bottom,0);/* 홈 인디케이터/하단바 여백 */
  transform:translateY(100%);
  transition:transform .3s cubic-bezier(.22,.61,.36,1);
}
.picker-ov.open .picker-sht{transform:translateY(0)}
.picker-hd{
  display:flex;justify-content:space-between;align-items:center;
  padding:16px 20px;border-bottom:1px solid var(--line);flex-shrink:0;
}
.picker-t{font-size:.9375rem;font-weight:650;letter-spacing:-.02em}
.picker-cl{
  background:var(--bg);border:1px solid var(--line-2);border-radius:8px;
  color:var(--ink-2);font-size:.79rem;font-weight:600;padding:7px 14px;
}
.picker-opts{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0}
.picker-opt{
  padding:14px 20px;font-size:.9375rem;font-weight:450;color:var(--ink);
  border-bottom:1px solid var(--line);transition:background .12s;
}
.picker-opt:last-child{border:none}
.picker-opt.on{color:var(--ink);background:var(--fill);font-weight:650}
.picker-opt:active{background:var(--fill-2)}

/* ── 로그인 게이트 ── */
/* .picker-ov(고정 오버레이·백드롭)를 재사용하되 하단 시트가 아니라 중앙 카드.
   ESC 핸들러에 authOv를 넣지 않았으므로 닫히지 않는다 — 닫을 수 있으면 게이트가 아니다 */
.auth-ov{align-items:center;padding:20px}
.auth-card{
  width:100%;max-width:360px;background:var(--bg);
  border:1px solid var(--line-2);border-radius:14px;padding:28px 22px;text-align:center;
  transform:translateY(10px);opacity:0;
  transition:transform .28s ease,opacity .28s ease;
}
.picker-ov.open .auth-card{transform:translateY(0);opacity:1}
.auth-ic{font-size:1.9rem;margin-bottom:10px}
.auth-t{font-size:1.0625rem;font-weight:700;color:var(--ink);margin-bottom:6px;letter-spacing:-.02em}
.auth-d{font-size:.8125rem;color:var(--ink-2);line-height:1.65;margin-bottom:18px}
.auth-pw{
  width:100%;padding:12px 14px;background:var(--bg);border:1px solid var(--line-2);
  border-radius:8px;color:var(--ink);font-size:.95rem;text-align:center;font-family:inherit;outline:none;
}
.auth-pw:focus{border-color:var(--ink)}
.auth-msg{min-height:18px;margin-top:9px;font-size:.78rem;color:var(--exp)}
.auth-btn{
  width:100%;margin-top:10px;padding:13px;background:var(--ink);color:var(--on-ink);
  border:none;border-radius:8px;font-weight:650;font-size:.9rem;
}
.auth-btn:disabled{opacity:.5}

/* ── 일회성 이상치 행 ── */
.anom{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}
.anom:last-child{border:none}
.anom-ic{width:30px;height:30px;min-width:30px;border-radius:8px;background:var(--fill);
  display:flex;align-items:center;justify-content:center;font-size:.9375rem}
.anom-bd{flex:1;min-width:0}
.anom-t{display:flex;align-items:center;gap:7px;min-width:0}
.anom-tt{font-size:.875rem;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.anom-x{flex-shrink:0;font-size:.6875rem;font-weight:600;color:var(--warn);background:none;
  border:none;padding:0}
.anom-s{font-size:.75rem;color:var(--ink-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.anom-v{font-size:.9375rem;font-weight:600;color:var(--exp);white-space:nowrap;letter-spacing:-.02em}

/* ── 연말정산 (분석 탭 세그먼트) ── */
.ty-cap{font-size:.75rem;color:var(--ink-3);line-height:1.6;margin:10px 0 14px}
.ty-sal{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin:12px 0 10px}
.ty-sal-v{font-size:1.3125rem;font-weight:700;letter-spacing:-.03em;color:var(--ink)}
.ty-bdg{font-size:.6875rem;font-weight:600;padding:1px 7px;border-radius:6px;letter-spacing:.01em;border:1px solid var(--line-2)}
.ty-bdg.auto{color:var(--ink-3);background:var(--fill)}
.ty-bdg.man{color:var(--ink);background:var(--fill-2);border-color:var(--line-2)}
.ty-facts{display:flex;gap:0;margin-top:12px;border-top:1px solid var(--line)}
.ty-fact{flex:1;background:none;border:none;border-radius:0;padding:11px 0}
.ty-fact+.ty-fact{border-left:1px solid var(--line);padding-left:12px}
.ty-fact-l{font-size:.6875rem;font-weight:600;color:var(--ink-3);letter-spacing:.01em;margin-bottom:3px}
.ty-fact-v{font-size:.875rem;font-weight:600;letter-spacing:-.02em}
/* 사용액 진행 바 — 신용/체크/현금 3색 스택 + 문턱 마커 */
.tybar-o{position:relative;margin:4px 0 9px;padding-top:11px}
.tybar-w{height:14px;background:var(--fill-2);border-radius:7px;overflow:hidden;display:flex;border:1px solid var(--line)}
.tybar-s{height:100%;transition:width .5s cubic-bezier(.4,0,.2,1)}
.tymk{position:absolute;top:5px;bottom:-3px;width:2px;background:var(--ink);border-radius:2px}
.tymk::after{content:attr(data-l);position:absolute;top:-11px;left:50%;transform:translateX(-50%);
  font-size:.6875rem;font-weight:600;color:var(--ink);white-space:nowrap}
/* 수단별 올해 사용액 — 세로 리스트(3열 그리드는 360px에서 금액이 잘림) */
.tyu{margin-top:13px;border-top:1px solid var(--line)}
.tyu-i{display:flex;align-items:center;gap:7px;padding:10px 0;border-bottom:1px solid var(--line)}
.tyu-d{width:9px;height:9px;border-radius:2px;flex-shrink:0}
.tyu-n{font-size:.8125rem;font-weight:550;white-space:nowrap}
.tyu-r{font-size:.6875rem;font-weight:600;padding:0;border-radius:0;white-space:nowrap;flex-shrink:0;color:var(--ink-3)}
.tyu-x{margin-left:auto;text-align:right;min-width:0}
.tyu-v{font-size:.875rem;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.tyu-s{font-size:.6875rem;color:var(--ink-3);margin-top:2px;white-space:nowrap}
.tyu-i.tot{border-bottom:none}
.tyu-i.tot .tyu-n{color:var(--ink-2)}
.tyu-i.tot .tyu-v{font-size:.9375rem;font-weight:700;color:var(--ink)}
/* 남은 공제 여력 */
.tyrm-l{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.75rem;color:var(--ink-3);margin:12px 0 6px}
.tyrm-l b{font-size:.8125rem;color:var(--ink);letter-spacing:-.02em}
.tyrm-bw{height:11px;background:var(--fill-2);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tyrm-b{height:100%;border-radius:6px;background:var(--inc);transition:width .5s cubic-bezier(.4,0,.2,1)}
.tyn{display:flex;gap:0;margin-top:15px;border-top:1px solid var(--line)}
.tyn-i{flex:1;min-width:0;background:none;border:none;border-radius:0;padding:12px 0;position:relative}
.tyn-i+.tyn-i{border-left:1px solid var(--line);padding-left:12px}
.tyn-i.on{background:none}
.tyn-i.on .tyn-v{color:var(--inc)}
.tyn-l{display:flex;align-items:center;gap:5px;font-size:.6875rem;font-weight:600;color:var(--ink-3);margin-bottom:5px}
.tyn-v{font-size:1.0625rem;font-weight:700;letter-spacing:-.03em}
.tyn-s{font-size:.6875rem;color:var(--ink-3);margin-top:5px;line-height:1.5}
.tyn-s b{color:var(--ink);font-weight:600}
.tyn-tag{position:absolute;top:0;right:0;font-size:.6875rem;font-weight:600;color:var(--inc);
  background:none;border:none;border-radius:0;padding:0}
/* 남은 기간 시나리오 비교 */
.tysc{margin-top:12px}
.tysc-r{margin-bottom:13px}
.tysc-r:last-child{margin-bottom:0}
.tysc-t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.8125rem;margin-bottom:6px}
.tysc-n{font-weight:550}
.tysc-v{font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.tysc-bw{height:9px;background:var(--fill-2);border-radius:5px;overflow:hidden}
.tysc-b{height:100%;border-radius:5px;transition:width .5s cubic-bezier(.4,0,.2,1)}
/* 결제수단 매핑 */
.tym{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.tym:last-child{border:none}
.tym-bd{flex:1;min-width:0}
.tym-nm{font-size:.8125rem;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tym-a{font-size:.6875rem;color:var(--ink-3);margin-top:2px}
.tym-sel{flex-shrink:0;background:var(--bg);border:1px solid var(--line-2);color:var(--ink);
  border-radius:8px;padding:8px 9px;font-size:.76rem;font-weight:550;font-family:inherit}
.tym-sel.un{border-color:var(--warn);color:var(--warn)}
.tym-tag{font-size:.6875rem;font-weight:600;color:var(--warn);background:none;
  border:none;padding:0;vertical-align:middle}
.tym-grp{font-size:.75rem;font-weight:600;color:var(--warn);padding:14px 0 4px;border-top:1px solid var(--line);margin-top:6px}
/* 설정 탭 마스터 행에 붙는 구분 셀렉트 (연말정산 매핑과 동일한 값) */
.m-item .tym-sel{padding:6px 7px;font-size:.72rem}

/* ── 진입 모션 (한 번, staggered) ── */
@keyframes riseIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.panel,.cards .card,.astat .am,.acct-tot,.acct-grid .am,.m-section,.lcard{
  animation:riseIn .3s cubic-bezier(.22,.61,.36,1) both}
.panel:nth-child(2){animation-delay:.03s}.panel:nth-child(3){animation-delay:.06s}
.panel:nth-child(4){animation-delay:.09s}.panel:nth-child(5){animation-delay:.12s}
.panel:nth-child(6){animation-delay:.15s}.panel:nth-child(7){animation-delay:.18s}
.astat .am:nth-child(2){animation-delay:.04s}.astat .am:nth-child(3){animation-delay:.08s}
@media(prefers-reduced-motion:reduce){
  .panel,.cards .card,.astat .am,.acct-tot,.acct-grid .am,.m-section,.lcard{animation:none}
}
</style>
</head>
<body>

<div class="app" id="appView">
  <header class="hd">
    <div class="hd-l">
      <!-- ₩ 를 글자로 두면 Pretendard dynamic-subset 이 그 글리프 때문에 조각 파일을 하나 더 받는다
           (실측 +25KB·요청 +1). 구조 아이콘은 인라인 SVG 라는 규약과도 맞다. -->
      <div class="logo-s" aria-hidden="true"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 5.5 7 15.5 11 7.5 15 15.5 18.5 5.5"/><path d="M2.6 10.2h16.8M2.6 13h16.8"/></svg></div>
      <div class="hd-t">우리집 가계부</div>
    </div>
    <div class="hd-r">
      <button class="hd-chip" id="hdUser" onclick="openDeviceUser()" aria-label="기기 사용자 설정">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span id="hdUserName"></span>
      </button>
      <button class="hd-btn" id="hdRefresh" onclick="refreshData()" aria-label="새로고침">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      </button>
    </div>
  </header>
  <nav class="nav" id="nav"></nav>
  <main id="main"><div class="spin"></div></main>
  <button class="fab" onclick="openSheet()" aria-label="내역 추가">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
  </button>
</div>

<div class="toast" id="toast"></div>

<div class="picker-ov" id="pickerOv" onclick="closePicker()">
  <div class="picker-sht" onclick="event.stopPropagation()">
    <div class="picker-hd">
      <span class="picker-t" id="pickerTitle">선택</span>
      <button class="picker-cl" onclick="closePicker()">닫기</button>
    </div>
    <div class="picker-opts" id="pickerOpts"></div>
  </div>
</div>

<div class="picker-ov" id="duOv" onclick="closeDeviceUser()">
  <div class="picker-sht" onclick="event.stopPropagation()">
    <div class="picker-hd">
      <span class="picker-t">이 기기는 누구의 폰인가요?</span>
      <button class="picker-cl" onclick="closeDeviceUser()">나중에</button>
    </div>
    <div style="padding:12px 22px 4px;font-size:.78rem;color:var(--ink-2);line-height:1.7">
      선택하면 이 기기에서 <b style="color:var(--ink)">입력·필터의 기본 사용자</b>가 그 사람으로 맞춰집니다. (설정 탭에서 언제든 변경)
    </div>
    <div class="picker-opts" id="duOpts"></div>
  </div>
</div>

<!-- 로그인 게이트. 세션이 없으면 여기서 막히고 데이터는 한 건도 불러오지 않는다.
     숨김 username은 display:none이 아니라 화면 밖으로 — display:none이면 비밀번호 관리자가
     폼을 인식하지 못해 '기기당 1회 입력'이 매번 입력으로 바뀐다 -->
<div class="picker-ov auth-ov" id="authOv">
  <div class="auth-card">
    <div class="auth-ic">🔒</div>
    <div class="auth-t">우리집 가계부</div>
    <div class="auth-d">가족 공용 비밀번호를 입력해주세요.<br>이 기기에서는 한 번만 입력하면 됩니다.</div>
    <form onsubmit="return doLogin(event)">
      <input type="text" name="username" autocomplete="username" value="우리집 가계부" readonly
             style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0" tabindex="-1" aria-hidden="true">
      <input class="auth-pw" id="authPw" type="password" autocomplete="current-password"
             placeholder="비밀번호" enterkeyhint="go" aria-label="가족 공용 비밀번호">
      <div class="auth-msg" id="authMsg"></div>
      <button class="auth-btn" id="authBtn" type="submit">로그인</button>
    </form>
  </div>
</div>

<!-- 비밀번호 변경 (로그인 상태에서만). 로그인 게이트와 달리 닫을 수 있다 -->
<div class="picker-ov auth-ov" id="pwOv" onclick="closePwChange()">
  <div class="auth-card" onclick="event.stopPropagation()">
    <div class="auth-ic">🔑</div>
    <div class="auth-t">비밀번호 변경</div>
    <div class="auth-d">가족이 함께 쓰는 비밀번호입니다.<br>바꾸면 다른 기기는 다시 로그인이 필요할 수 있어요.</div>
    <form onsubmit="return doPwChange(event)">
      <input type="text" name="username" autocomplete="username" value="우리집 가계부" readonly
             style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0" tabindex="-1" aria-hidden="true">
      <input class="auth-pw" id="pwCur"  type="password" autocomplete="current-password" placeholder="현재 비밀번호">
      <input class="auth-pw" id="pwNew"  type="password" autocomplete="new-password" placeholder="새 비밀번호 (6자 이상)" style="margin-top:8px">
      <input class="auth-pw" id="pwNew2" type="password" autocomplete="new-password" placeholder="새 비밀번호 확인" style="margin-top:8px" enterkeyhint="go">
      <div class="auth-msg" id="pwMsg"></div>
      <button class="auth-btn" id="pwBtn" type="submit">변경하기</button>
      <button type="button" class="picker-cl" style="margin-top:10px;width:100%" onclick="closePwChange()">취소</button>
    </form>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="s-top">
      <div class="s-t" id="sheetTitle">내역 추가</div>
      <button class="s-x" onclick="closeSheet()">취소</button>
    </div>
    <div class="s-bd">
      <div class="frow">
        <label class="flb">구분</label>
        <div class="toggle">
          <button class="tg tg-e" id="tgExp" onclick="setType('지출')">지출</button>
          <button class="tg" id="tgInc" onclick="setType('입금')">입금</button>
          <button class="tg" id="tgTrf" onclick="setType('이동')">이동</button>
        </div>
      </div>
      <div class="frow"><label class="flb">누가</label><div class="seg" id="memberSeg"></div></div>
      <!-- 날짜: 네이티브 <input type=date> 를 투명하게 덮고 표시만 우리가 그린다.

<script>
/* ── 상수 ── */
const DEFAULT_CATS = ["식비","생활비","교통","의료","쇼핑","문화","교육","통신","보험","고정비","데이트","월급","이자","기타"];
const TRANSFER_CAT = "계좌간 이동";  // 계좌간 이동 거래 카테고리 — 소비/수입 통계에선 제외, 계좌 잔액엔 반영
const MASTER_KEYS  = {categories:"카테고리", methods:"결제수단", accounts:"계좌"};
const MASTER_TYPE  = {categories:"category", methods:"method", accounts:"account"};  // JS key → DB type
const MASTER_KEY_OF= {category:"categories", method:"methods", account:"accounts"};   // DB type → JS key
const DEVICE_USER_KEY = "ourbudget.deviceUser";  // localStorage: 이 기기의 기본 사용자
// 구글 시트 백업 (Apps Script 웹앱). URL 비우면 백업 비활성.
const GAS_BACKUP_URL    = "https://script.google.com/macros/s/AKfycbweq9PLy5VDBa68VN-76aWL8wUW6nvLZOlVaktn5oZE-HMkwg_iuXNGP6dBfcqjH56G/exec";  // Apps Script 웹앱
const GAS_BACKUP_SECRET = "ourbudget-backup-2026";  // GAS 코드의 SECRET과 동일하게
const CAT_ICON     = {생활비:"🛒",고정비:"🏠",월급:"💵",이자:"📈",데이트:"❤️",식비:"🍽️",교통:"🚌",의료:"💊",쇼핑:"👜",문화:"🎬",교육:"📚",통신:"📱",보험:"🛡️",기타:"📌","계좌간 이동":"🔄"};
/* 연말정산 — 결제수단별 소득공제 구분.
   공제율은 체크·현금영수증이 동일(30%)하지만, 사용 추이를 따로 보려고 화면에선 셋을 분리한다. */
const TY_KINDS     = {credit:"신용", check:"체크", cash:"현금", none:"제외"};   // 지출: 결제수단별 공제 구분
const TY_CAT_KINDS = {income:"소득", none:"제외"};                              // 소득: 카테고리별 총급여 산입 여부
const TY_RATE  = {credit:.15, check:.30, cash:.30, none:0};
/* 연말정산 3색 — 한 스택 막대에 함께 놓이므로 all-pairs 검증을 통과해야 한다.
   ⚠️ s4(노랑)를 쓰지 말 것: s2(주황)와 함께 두면 정상 시력으로도 구분이 안 된다
   (validate_palette.js 실측 ΔE 13.7 라이트 / 10.6 다크 → FAIL). s1·s2·s3 은 PASS. */
const tyColor = k => cssVar({credit:"--s2", check:"--s1", cash:"--s3"}[k] || "--ink-3");
const SALARY_RE = /월급|급여|상여|보너스/;   // 소득 카테고리 '추천'에만 사용 — 집계는 CTMAP(사용자 매핑)만 따른다
// 앱에서 DDL을 실행할 권한이 없어(anon key), 테이블이 없으면 화면에 이 SQL을 띄워 직접 실행하게 한다.
// ⚠️ 이 SQL은 사용자가 그대로 붙여넣어 실행한다 → 나머지 5개 테이블과 **똑같은 경계**여야 한다.
//    예전엔 `create policy "all" ... using (true)`(anon 포함)였다. 그대로 실행하면 로그인 게이트를
//    우회해 anon key만으로 tax_map을 읽을 수 있어, 2026-08-07에 닫은 구멍을 앱이 다시 열어주는 꼴이었다.
//    revoke가 따로 필요한 이유: Supabase는 public 스키마의 새 테이블에 anon 권한을 기본 부여한다.
const TAX_MAP_DDL = `create table if not exists public.tax_map (
  member text references members(name) on delete cascade,
  type   text not null check (type in ('method','category')),
  value  text not null default '',
  kind   text not null,
  primary key (member, type, value),
  check ( (type='method'   and kind in ('credit','check','cash','none'))
       or (type='category' and kind in ('income','none')) )
);
alter table public.tax_map enable row level security;
-- 가족 안에서는 서로의 내역을 다 본다. 경계는 '로그인 여부' 하나 (다른 테이블과 동일)
create policy family_only on public.tax_map
  for all to authenticated using (true) with check (true);
-- 정책만 바꾸고 이 줄을 빠뜨리면 anon에게 200 []가 간다 (차단처럼 보이지만 열려 있음)
revoke all on public.tax_map from anon;`;
// 탭 아이콘 — Lucide 스타일 인라인 SVG (이모지는 OS별 렌더가 제각각이라 구조 아이콘엔 미사용)
const NI = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const TABS = [
  ["list",     NI('<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M14 8H8"/><path d="M16 12H8"/><path d="M13 16H8"/>'), "내역"],
  ["cat",      NI('<path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/>'), "분류"],
  ["limit",    NI('<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>'), "한도"],
  ["analysis", NI('<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>'), "분석"],
  ["acct",     NI('<path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/>'), "계좌"],
  ["master",   NI('<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>'), "설정"]
];

/* ── 상태 ── */
let sb;
let MEMBERS       = [];     // DB에서 동적 로드
let ROWS          = [];
let LIMITS        = {};     // {멤버: {카테고리: 금액}}
let MASTER        = {};     // {멤버: {categories, methods, accounts}}
let BILLING_STARTS = {};    // {멤버: 시작일} — app_settings에서 로드
let DEVICE_USER    = null;  // 이 기기의 기본 사용자 (localStorage)
let USER_ICONS     = {};    // {카테고리: 이모지} — app_settings의 cat_icon_* (전 멤버 공통)
let WARN_TH        = 80;    // 한도 경고 임계값(%) — app_settings.warn_threshold
let AN_PERIODS     = 3;     // 분석·분류 탭 표시 주기 수 — app_settings.analysis_periods
let MTMAP          = {};    // {멤버: {결제수단: kind}} — tax_map(type='method')
let CTMAP          = {};    // {멤버: {카테고리: kind}} — tax_map(type='category'), 소득 판정
let TAX_READY      = false; // tax_map 테이블 존재 여부 — false면 연말정산이 설정 안내를 띄운다
let TY_SALARY      = {};    // {멤버: 총급여 수동값} — app_settings의 ty_salary_*

let tab          = "list";
let scope        = "current";
let periodOffset = 0;       // 내역·분류 탭 주기 탐색: 0=이번 주기, -1=한 주기 전 …
let memberFilter = "전체";  // 내역·분류·계좌 탭 공통 필터
let searchQ      = "";      // 내역 탭 검색어
let catBy        = "category"; // 분류 탭 집계 기준: 'category' | 'method'
let limitMember  = null;    // 한도 탭 전용
let masterMember = null;    // 설정 탭 전용
let anView       = "spend"; // 분석 탭 세그먼트: spend(지출분석) | tax(연말정산)
let tyMember     = null;    // 연말정산 전용 멤버 ('전체' 없음 — 연말정산은 개인 단위)
let typeVal      = "지출";
let memberVal    = null;    // 입력 시트
let editId       = null;
let loadError    = null;
// 부분 로드 실패한 테이블 이름들 — 앱은 폴백으로 계속 돌지만 화면 상단 배너로 반드시 표면화한다.
// (예전엔 master_data 로드가 실패하면 조용히 DEFAULT_CATS로 떨어져 '설정이 사라진' 것처럼 보였다)
let loadWarn     = [];

/* ── 유틸 ── */
const $        = id => document.getElementById(id);
// 날짜 문자열 → Date ('YYYY-MM-DD'는 정오로 파싱해 타임존 경계 오차 방지)
const parseDate = s => new Date(s.length===10 ? s+"T12:00:00" : s);
const todayStr  = () => { const t=new Date(); return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`; };
// 콤마 포함 금액 input 값 → 숫자
const amtVal   = id => Number($(id).value.replace(/[^0-9]/g,""))||0;
// 렌더당 수백 번 호출 — 포매터 1회 생성 후 재사용(매 호출 toLocaleString보다 빠름, 출력 동일)
const _nf      = new Intl.NumberFormat("ko-KR");
const comma    = n => _nf.format(Number(n||0));
const won      = n => comma(n)+"원";
const wonShort = n => n>=10000 ? (n/10000).toFixed(n%10000?1:0)+"만" : comma(n);
const icon     = c => USER_ICONS[c] || CAT_ICON[c] || "💳";
// HTML 이스케이프 — 사용자 입력(메모·항목명·멤버명 등)을 innerHTML에 넣을 때 필수
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
// onclick="fn('…')" 속 JS 문자열 리터럴용 — JS 이스케이프 후 HTML 이스케이프 (따옴표 든 항목명에도 안전)
const jsq = s => esc(String(s==null?"":s).replace(/\\/g,"\\\\").replace(/'/g,"\\'"));
let _toastT=null;  // 연속 호출 시 이전 타이머가 새 토스트를 조기에 닫지 않도록
const toast    = m => { const t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(_toastT); _toastT=setTimeout(()=>t.classList.remove("show"),1800); };
const empty    = (ic,msg) => `<div class="empty"><div class="e-ic">${ic}</div><p>${msg.replace(/\n/g,"<br>")}</p></div>`;
// Supabase 응답 에러 공통 처리 — 에러면 토스트 후 true (호출부는 if(dbErr(res))return; 한 줄)
const dbErr    = (res,pre="오류") => { if(res.error){ toast(pre+": "+res.error.message); return true; } return false; };
// 필 바(.filter) / 세그먼트(.seg) 버튼 공통 빌더 — items: [값,라벨] 쌍 또는 문자열 배열
const pills    = (items,cur,fn) => `<div class="filter">${items.map(it=>{const[v,lb]=Array.isArray(it)?it:[it,it];return `<span class="pill${cur===v?' on':''}" onclick="${fn}('${jsq(v)}')">${esc(lb)}</span>`;}).join("")}</div>`;
const segBtns  = (items,cur,fn) => items.map(m=>`<button class="${cur===m?'on':''}" onclick="${fn}('${jsq(m)}')">${esc(m)}</button>`).join("");
// 기기 기본 사용자가 멤버 목록에 있으면 그 사람을, 없으면 첫 멤버를 기본값으로
const defMember = () => (DEVICE_USER && MEMBERS.includes(DEVICE_USER)) ? DEVICE_USER : (MEMBERS[0]||null);
// 멤버의 카테고리 목록 — master_data 설정 + 이미 한도가 저장된 카테고리(레거시 보존) 합집합
const catsOf = m => Array.from(new Set([...((MASTER[m]&&MASTER[m].categories)||DEFAULT_CATS),...Object.keys(LIMITS[m]||{})]));

// 계좌간 이동 거래 여부 — 소비/수입 통계에선 제외, 계좌 잔액엔 포함
const isTransfer = r => r.category===TRANSFER_CAT;
// 짝 없는 이동 leg 탐지. 한쪽만 남으면 그 계좌 잔액이 금액만큼 틀어지는데, isTransfer()로 수입·지출
// 통계에서도 빠져 있어 그 돈이 화면 어디에도 드러나지 않는다(50만원 건이 실제로 그렇게 숨어 있었음).
// 짝 판정 기준은 delEntry의 mate 탐색과 동일하게 유지할 것: 같은 멤버·날짜·금액의 반대 type
function orphanTransfers(){
  const g = {};
  ROWS.forEach(r => {
    if(!isTransfer(r)) return;
    const k = `${r.member}|${r.date}|${Number(r.amount)}`;
    (g[k] || (g[k] = [])).push(r);
  });
  const out = [];
  Object.values(g).forEach(list => {
    const ex = list.filter(r => r.type!=="입금"), inc = list.filter(r => r.type==="입금");
    const n = Math.min(ex.length, inc.length);   // 앞의 n쌍은 정상 매칭, 남는 쪽이 짝 없는 leg
    out.push(...ex.slice(n), ...inc.slice(n));
  });
  return out.sort((a,b) => String(b.date).localeCompare(String(a.date)));  // 최신순 (동일 날짜는 원래 순서 유지)
}
// 합계 헬퍼 (지출/수입) — 여러 뷰에서 반복되던 filter+reduce 통합. 이동은 합계에서 제외
const expOf = rs => rs.reduce((s,r)=>s+((r.type!=="입금"&&!isTransfer(r))?r.amount:0),0);
const incOf = rs => rs.reduce((s,r)=>s+((r.type==="입금"&&!isTransfer(r))?r.amount:0),0);
// CSS 커스텀 프로퍼티를 읽는다 — 차트 색을 하드코딩하면 OS 다크모드에서 따라오지 않는다.
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* 카테고리 색 — 슬롯 6개 + '기타'(무채색).
   ⚠️ 옛 방식(CAT_PALETTE[i % 12])으로 되돌리지 말 것. 라이트·다크 양쪽에서
   색각이상 분리도(ΔE)를 통과하는 색은 6개뿐이라, 순환시키면 같은 차트 안에서
   서로 다른 카테고리가 같은 색이 된다. 대신 '그리는 계열 수'를 5로 제한하고
   나머지는 '기타'로 접는다 — 순환할 일 자체를 없앤다.
   팔레트 검증: dataviz 스킬의 validate_palette.js (6검사 전 항목 PASS).

   슬롯 배정은 viewAnalysis 가 표시 주기 전체합 상위 6으로 한 번 정하고,
   도넛·스택막대·추이라인 세 차트가 그 매핑을 공유한다(한 화면에서 같은 색 = 같은 항목).
   ⚠️ 남은 트레이드오프: 멤버 필터를 바꿔 상위 6의 '구성원'이 달라지면 색이 이동할 수 있다.
   범례가 이름+금액을 직접 라벨로 달고 있어 오독으로 이어지지는 않는다. */
const ETC_CAT = "기타";
let _catSlots = {};                       // { 카테고리: 1..5 }
function setCatSlots(rankedCats){
  _catSlots = {};
  rankedCats.slice(0,6).forEach((c,i) => { _catSlots[String(c)] = i+1; });
}
function catColor(c){
  const s = _catSlots[String(c)];
  return s ? cssVar("--s"+s) : cssVar("--ink-3");
}
// 고정성 지출 카테고리 (절약 팁/고정·변동 분석에서 '고정'으로 분류)
const FIXED_CATS = new Set(["고정비","통신","보험","이자","월세","관리비","교육","구독","월급"]);

/* ── 결제 주기 ── */
function billingPeriod(member, ref){
  const sd=(member&&BILLING_STARTS[member])||25;
  ref=ref||new Date(); const d=ref.getDate(),m=ref.getMonth(),y=ref.getFullYear();
  const sy=d>=sd?y:(m===0?y-1:y), sm=d>=sd?m:(m===0?11:m-1);
  const start=new Date(sy,sm,sd);
  // 종료 = 다음 시작일 하루 전 (sd=1이면 같은 달 말일 — 다음달로 넘기던 버그 수정됨)
  const end=new Date(sy,sm+1,sd); end.setDate(end.getDate()-1); end.setHours(23,59,59);
  return {start,end,label:`${sm+1}/${sd} ~ ${end.getMonth()+1}/${end.getDate()}`,key:`${sy}-${String(sm+1).padStart(2,"0")}`};
}
function recentPeriods(n, member){
  member=member||MEMBERS[0];
  const sd=(member&&BILLING_STARTS[member])||25;
  const cur=billingPeriod(member);
  return Array.from({length:n},(_,i)=>billingPeriod(member,new Date(cur.start.getFullYear(),cur.start.getMonth()-(n-1-i),sd)));
}
const inPeriod = (s,p) => { const d=parseDate(s); return d>=p.start&&d<=p.end; };
/* 최근 n주기로 행을 나눈다 (인덱스 n-1 = 이번 주기).
   ⚠️ 멤버마다 주기 시작일이 다르다(정우 25일 / 지현 21일). 한 사람 기준으로 잘라내면
   지현의 21~24일 거래가 엉뚱한 주기에 들어가, 같은 '이번 주기'인데 내역 탭과 분석·분류 탭의
   숫자가 어긋난다 — 내역 탭 scoped()는 행마다 그 멤버의 주기를 쓰기 때문.
   → 라벨은 기준 멤버 주기로 표시하되, 버킷 판정은 각 행의 멤버 주기로 한다. */
function bucketByPeriod(rows, n, refMember){
  const cache={};   // 멤버별 recentPeriods — 행마다 Date를 새로 만들지 않도록
  const psOf = m => cache[m] || (cache[m] = recentPeriods(n, MEMBERS.includes(m) ? m : refMember));
  const out = Array.from({length:n}, () => []);
  rows.forEach(r => {
    const ps = psOf(r.member);
    for(let i=0;i<n;i++){ if(inPeriod(r.date, ps[i])){ out[i].push(r); break; } }
  });
  return out;
}
/* '전체' 필터인데 멤버들의 주기 시작일이 갈리는 상태 — 표시 라벨은 기준 멤버 것이지만
   집계는 각자 주기라, 그 사실을 화면에 밝혀야 라벨과 숫자가 어긋나 보이지 않는다 */
const mixedPeriods = () => memberFilter==="전체" &&
  new Set(MEMBERS.map(m => BILLING_STARTS[m]||25)).size > 1;
// 현재 조회 중인 주기 — periodOffset(0=이번, -1=한 주기 전…) 반영
function viewedPeriod(member){
  const cur=billingPeriod(member);
  if(!periodOffset) return cur;
  const sd=(member&&BILLING_STARTS[member])||25;
  return billingPeriod(member, new Date(cur.start.getFullYear(), cur.start.getMonth()+periodOffset, sd));
}

/* ── 초기화 ── */
// ⚠️ load가 아니라 DOMContentLoaded다. load는 폰트·이미지 등 모든 서브리소스를 기다리므로
// 첫 DB 요청이 폰트 다운로드 뒤에 줄을 선다(2026-08-15 실측: 데스크톱 +817ms, 4G +3,164ms).
// defer 스크립트(supabase-js·chart.js)는 명세상 DOMContentLoaded '직전'에 실행이 끝나므로
// 이 시점에 window.supabase·Chart는 이미 있다 — window.onload로 되돌리지 말 것.
document.addEventListener("DOMContentLoaded", async () => {
  if(!window.supabase){  // CDN 로드 실패 시 흰 화면 대신 에러 카드
    loadError="라이브러리(CDN) 로드 실패 — 인터넷 연결을 확인한 뒤 새로고침해주세요";
    buildNav(); render(); return;
  }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
    auth:{ persistSession:true, autoRefreshToken:true, storageKey:"ourbudget.auth" }
  });
  try { DEVICE_USER = localStorage.getItem(DEVICE_USER_KEY) || null; } catch(e){ DEVICE_USER = null; }
  buildNav();
  // 세션 만료·비밀번호 변경 시 로그인 화면으로 되돌린다.
  // 이게 없으면 빨간 '데이터 연결 오류' 카드가 떠서 원인을 오도한다(RLS 문제로 오인)
  sb.auth.onAuthStateChange(ev => { if(ev==="SIGNED_OUT") showAuth(); });
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ showAuth(); return; }   // 로그인 전엔 loadAll을 호출하지 않는다
  await startApp();
});

// 세션이 확보된 뒤의 시작 절차 — 기존 onload 후반부 그대로
async function startApp(){
  hideAuth();
  try { await loadAll(); }
  catch(e) {
    if(isAuthErr(e)){ showAuth(); return; }   // 인증 문제면 에러 카드가 아니라 로그인 화면
    loadError=e.message; console.error("초기화 오류:",e);
  }
  // 기기 사용자가 멤버에 없으면(삭제·개명) 무효화
  if(DEVICE_USER && !MEMBERS.includes(DEVICE_USER)){ DEVICE_USER=null; try{localStorage.removeItem(DEVICE_USER_KEY);}catch(e){} }
  // 기기 사용자가 정해져 있으면 각 필터의 기본값을 그 사람으로
  if(DEVICE_USER) memberFilter = DEVICE_USER;
  renderMemberSeg();
  render();
  // 최초 1회: 이 기기의 사용자를 아직 안 정했으면 선택 모달
  if(!DEVICE_USER && MEMBERS.length && !loadError) openDeviceUser();
  // 화면이 다 그려진 뒤 한가할 때 chart.js를 미리 받아둔다 — 분석 탭 첫 진입에서 기다리지 않도록.
  // 크리티컬 패스 밖(첫 DB 요청·첫 렌더가 모두 끝난 뒤)이라 초기 로딩에는 영향이 없다.
  // ⚠️ bind 필수 — window에서 떼어내 호출하면 Chrome이 Illegal invocation을 던진다
  const idle = window.requestIdleCallback ? window.requestIdleCallback.bind(window) : (f=>setTimeout(f,1500));
  idle(()=>ensureChart());
}

/* ── 로그인 게이트 ── */
// PostgREST는 세션 문제를 401/PGRST301로 알린다. 일반 로드 오류와 섞으면 안내가 틀어진다
const isAuthErr = e => !!e && (e.status===401 || /JWT|jwt expired|PGRST301|Invalid Refresh Token/i.test(e.message||""));

function showAuth(){
  // 뒤 화면을 비운다 — 초기 스피너가 영원히 돌지 않게, 그리고 세션이 끊겼을 때

}

    msg.textContent = /rate|Too many/i.test(error.message||"")

/* ── 비밀번호 변경 (로그인 상태에서) ── */

async function doPwChange(ev){

  const cur=$("pwCur").value, nw=$("pwNew").value, nw2=$("pwNew2").value;

  btn.disabled=true; btn.textContent="변경 중…"; msg.textContent="";
  // 현재 비밀번호를 먼저 확인한다. 세션만으로 바꾸게 두면 폰을 주운 사람이
  // 비밀번호를 바꿔 가족 전체를 잠가버릴 수 있다 — 데이터 열람보다 더 나쁜 결과
  const chk = await sb.auth.signInWithPassword({ email:FAMILY_EMAIL, password:cur });

/* ── 데이터 로드 ── */
// 거래내역 전량 수신. PostgREST에 `max-rows` 상한이 걸려 있으면 응답이 **에러 없이 잘려서** 오고,
// 그 순간부터 모든 집계가 조용히 틀어진다 → count(전체 행 수)와 실수신 건수를 대조해 나머지를 이어 받는다.
// id 2차 정렬: 같은 날짜 내 순서가 리로드·페이지 경계마다 뒤섞이지 않게(페이지네이션의 전제)
async function fetchTransactions(){
  const q = () => sb.from("transactions").select("*",{count:"exact"}).order("date",{ascending:false}).order("id");
  const first = await q();
  if(first.error) return first;
  const head = first.data||[];
  const total = first.count, page = head.length;
  if(total==null || page===0 || head.length>=total) return {data:head, error:null, count:total};
  // ⚠️ 순차 await로 이어받지 말 것. 첫 응답의 count로 남은 페이지 수를 이미 알므로 한 번에 던진다.
  // 예전엔 1,000행마다 왕복 1회가 직렬로 붙어 5,000행이면 +4회(실측 RTT 0.15~0.19s → ≈0.7초)였다.
  const reqs = [];
  for(let from=page; from<total; from+=page) reqs.push(q().range(from, Math.min(from+page, total)-1));
  const pages = await Promise.all(reqs);
  const bad = pages.find(p => p.error);
  if(bad) return bad;
  const data = head.concat(...pages.map(p => p.data||[]));
  // .range는 오프셋 기반이라 받는 도중 다른 기기가 입력하면 페이지 경계에서 같은 행이 겹칠 수 있다.
  // 중복 1건이 집계를 통째로 틀어지게 하므로 id로 걸러낸다 (순서는 유지).
  const seen = new Set();
  return {data: data.filter(r => !seen.has(r.id) && seen.add(r.id)), error:null, count:total};
}
async function loadAll(){
  loadError = null;
  loadWarn  = [];
  const [mem, tx, lim, mst, cfg, mtm] = await Promise.all([
    sb.from("members").select("name").order("id"),
    fetchTransactions(),
    sb.from("category_limits").select("*"),
    sb.from("master_data").select("*"),
    sb.from("app_settings").select("*"),
    sb.from("tax_map").select("*")
  ]);

  if(mem.error) throw new Error("멤버 로드 오류: "+mem.error.message);
  MEMBERS = (mem.data||[]).map(m=>m.name);

  // 탭별 선택 멤버를 MEMBERS 목록에 맞게 보정 (기기 사용자 우선)
  if(!MEMBERS.includes(limitMember))  limitMember  = defMember();
  if(!MEMBERS.includes(masterMember)) masterMember = defMember();
  if(!MEMBERS.includes(memberVal))    memberVal    = defMember();
  if(!MEMBERS.includes(tyMember))     tyMember     = defMember();

  if(tx.error) throw new Error(tx.error.message||"거래내역 로드 오류");
  ROWS = tx.data||[];

  // 아래 세 테이블은 실패해도 앱을 세우지 않고 폴백으로 넘어간다. 대신 무엇이 안 왔는지 배너로 알린다
  // — 폴백값(빈 한도·DEFAULT_CATS·기본 설정)이 '사용자가 지운 것'처럼 보이면 안 되므로.
  if(lim.error) loadWarn.push("한도 설정");
  if(mst.error) loadWarn.push("카테고리·결제수단·계좌 설정");
  if(cfg.error) loadWarn.push("결제주기·앱 설정");
  // tax_map 실패는 TAX_READY=false로 연말정산 화면이 직접 안내하므로 여기서 중복 경고하지 않는다

  // LIMITS: {멤버: {카테고리: 금액}}
  LIMITS = {};
  MEMBERS.forEach(m => LIMITS[m] = {});
  if(!lim.error)(lim.data||[]).forEach(l => {
    if(!LIMITS[l.member]) LIMITS[l.member] = {};
    LIMITS[l.member][l.category] = Number(l.monthly_limit);
  });

  // MASTER: {멤버: {categories, methods, accounts}}
  MASTER = {};
  MEMBERS.forEach(m => MASTER[m] = {categories:[],methods:[],accounts:[]});
  if(!mst.error)(mst.data||[]).forEach(row => {
    if(!MASTER[row.member]) MASTER[row.member] = {categories:[],methods:[],accounts:[]};
    const key = MASTER_KEY_OF[row.type] || 'accounts';
    MASTER[row.member][key].push(row.value);
  });
  MEMBERS.forEach(m => { if(!MASTER[m].categories.length) MASTER[m].categories=[...DEFAULT_CATS]; });

  // 연말정산 매핑 — MTMAP(결제수단→공제구분) / CTMAP(카테고리→소득여부)
  // 테이블이 아직 없으면 error로 떨어진다. 그땐 빈 맵으로 두고 앱의 나머지는 그대로 동작시키되,
  // TAX_READY=false로 연말정산 화면이 '집계 0원'을 침묵하지 않고 설정 안내를 띄우게 한다
  MTMAP = {}; CTMAP = {}; TAX_READY = !mtm.error;
  MEMBERS.forEach(m => { MTMAP[m] = {}; CTMAP[m] = {}; });
  if(!mtm.error)(mtm.data||[]).forEach(row => {
    const bag = row.type==="category" ? CTMAP : MTMAP;
    if(!bag[row.member]) bag[row.member] = {};
    bag[row.member][row.value||""] = row.kind;
  });

  // app_settings: 전역 fallback → 멤버별 override + 앱 설정·카테고리 아이콘
  BILLING_STARTS={}; USER_ICONS={}; WARN_TH=80; AN_PERIODS=3; TY_SALARY={};
  let _globalBS=25;
  if(!cfg.error)(cfg.data||[]).forEach(row=>{
    if(row.key==='billing_start_day'){const v=Number(row.value);if(v>=1&&v<=28)_globalBS=v;}
    if(row.key.startsWith('billing_start_')){
      const mem=row.key.slice('billing_start_'.length);
      if(MEMBERS.includes(mem)){const v=Number(row.value);if(v>=1&&v<=28)BILLING_STARTS[mem]=v;}
    }
    if(row.key==='warn_threshold'){const v=Number(row.value);if(v>=50&&v<=99)WARN_TH=v;}
    if(row.key==='analysis_periods'){const v=Number(row.value);if(v>=2&&v<=6)AN_PERIODS=v;}
    if(row.key.startsWith('ty_salary_')){
      const mem=row.key.slice('ty_salary_'.length);
      const v=Number(row.value); if(MEMBERS.includes(mem)&&v>0)TY_SALARY[mem]=v;
    }
    if(row.key.startsWith('cat_icon_')&&row.value)USER_ICONS[row.key.slice('cat_icon_'.length)]=row.value;
  });
  MEMBERS.forEach(m=>{if(!(m in BILLING_STARTS))BILLING_STARTS[m]=_globalBS;});

/* ── 구글 시트 백업 (단방향, fire-and-forget) ── */
function backupToSheet(action, payload){
  if(!GAS_BACKUP_URL) return;  // URL 미설정 시 비활성
  try{
    fetch(GAS_BACKUP_URL, {
      method:"POST", mode:"no-cors", keepalive:true,
      headers:{"Content-Type":"text/plain;charset=utf-8"},  // preflight 회피
      body: JSON.stringify({secret:GAS_BACKUP_SECRET, action, ...payload})
    }).catch(()=>{});  // 백업 실패는 앱 동작에 영향 없음
  }catch(e){}
}

/* ── 거래 저장/삭제 ── */
async function saveEntry(){
  const amount = amtVal("fAmount");
  if(typeVal==="이동"){ return saveTransfer(amount); }
  const row = {
    date:     $("fDate").value,
    amount,
    type:     typeVal,
    member:   memberVal,
    category: $("fCategory").value,
    method:   $("fMethod").value,
    account:  $("fAccount").value,
    memo:     $("fMemo").value.trim()
  };
  if(!row.date){ toast("날짜를 선택해주세요"); return; }
  if(!row.amount||!row.category||!row.account){ toast("금액·카테고리·계좌는 필수예요"); return; }
  const btn=$("saveBtn");
  btn.textContent="저장 중..."; btn.disabled=true;
  const wasEdit=!!editId;
  try {
    let savedId=editId;
    if(wasEdit){
      const res=await sb.from("transactions").update(row).eq("id",editId);
      if(dbErr(res,"저장 오류")) return;
    } else {
      const res=await sb.from("transactions").insert(row).select("id").single();
      if(dbErr(res,"저장 오류")) return;
      savedId=res.data&&res.data.id;
    }
    backupToSheet("upsert",{id:savedId,...row});  // 구글 시트 백업
    closeSheet(); await reloadAndRender();
    toast(wasEdit?"수정 완료":"저장 완료");
  } catch(e){ toast("오류: "+e.message); }
  finally{ btn.textContent=wasEdit?"수정하기":"저장하기"; btn.disabled=false; }
}

// 계좌간 이동: 출금계좌 지출 + 입금계좌 입금 2건을 한 번에 생성 (category='계좌간 이동')
async function saveTransfer(amount){
  const from = $("fFromAccount").value;
  const to   = $("fToAccount").value;
  const date = $("fDate").value;
  const memo = $("fMemo").value.trim();
  if(!date){ toast("날짜를 선택해주세요"); return; }
  if(!amount||!from||!to){ toast("금액·출금계좌·입금계좌는 필수예요"); return; }
  if(from===to){ toast("출금·입금 계좌가 같아요"); return; }
  const memoTxt = memo || `${from} → ${to}`;
  const base = { date, amount, member:memberVal, category:TRANSFER_CAT, method:"", memo:memoTxt };
  const out  = { ...base, type:"지출", account:from };  // 출금계좌에서 빠짐
  const inn  = { ...base, type:"입금", account:to };    // 입금계좌로 들어옴
  const btn=$("saveBtn");
  btn.textContent="저장 중..."; btn.disabled=true;
  try {
    // 삽입된 행 전체를 받아 각 행 데이터 그대로 백업(반환 순서에 의존하지 않아 id-행 매칭 안전)
    const res=await sb.from("transactions").insert([out,inn]).select();
    if(dbErr(res,"저장 오류")) return;
    (res.data||[]).forEach(row=>backupToSheet("upsert",row));  // 구글 시트 백업(출금·입금 2건)
    closeSheet(); await reloadAndRender();
    toast("이동 완료");
  } catch(e){ toast("오류: "+e.message); }
  finally{ btn.textContent="저장하기"; btn.disabled=false; }
}

async function delEntry(id){
  const r = ROWS.find(x=>x.id===id);
  const trf = r && isTransfer(r);
  // 이동이면 짝(반대편 leg)을 찾아 함께 삭제 → 한쪽만 남아 잔액이 깨지는 것 방지
  const mate = trf ? ROWS.find(x=>x.id!==id && isTransfer(x) && x.member===r.member
      && x.date===r.date && Number(x.amount)===Number(r.amount) && x.type!==r.type) : null;
  if(!confirm(trf?"계좌간 이동 거래예요. 출금·입금 양쪽이 함께 삭제됩니다. 계속할까요?":"삭제하시겠습니까?")) return;
  const ids = mate ? [id, mate.id] : [id];
  const res=await sb.from("transactions").delete().in("id",ids);
  if(dbErr(res,"삭제 오류")) return;
  ids.forEach(x=>backupToSheet("delete",{id:x}));  // 구글 시트 백업(양쪽 모두)
  await reloadAndRender(); toast(mate?"이동(2건) 삭제 완료":"삭제 완료");
}

/* ── CSV 내보내기 (전체 거래내역, 엑셀용 UTF-8 BOM) ── */
function exportCSV(){
  if(!ROWS.length){ toast("내보낼 내역이 없어요"); return; }
  const q=v=>{ v=String(v==null?"":v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const lines=[["날짜","구분","멤버","카테고리","금액","결제수단","계좌","메모"].join(",")];
  [...ROWS].sort((a,b)=>String(a.date).localeCompare(String(b.date)))
    .forEach(r=>lines.push([r.date,r.type,r.member,r.category,r.amount,r.method,r.account,r.memo].map(q).join(",")));
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["\uFEFF"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"}));  // BOM: 엑셀 한글 깨짐 방지
  a.download=`우리집가계부_${todayStr()}.csv`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast(`${ROWS.length}건 내보냈어요`);
}
